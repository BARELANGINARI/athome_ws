# Single source of truth parameter untuk seluruh node athome_hri:
#   - barelang_hri_node / barelang_audio_bridge (help_me_carry_hri)
#   - stt_engine (stt_engine_node)
#   - tts_engine (tts_engine_node)
# Cukup ubah nilai di sini, seluruh node otomatis mengikuti.
/**:
  ros__parameters:
    # Audio Input / Output (-1 = auto-detect USB mic / default system speaker)
    mic_device_index: -1
    speaker_device_index: -1
    enable_local_mic: true
    enable_ws_audio: true
    enable_visualizer: true #false untuk mematikan visualisasi VAD
    enable_live_meter: true
    enable_local_speaker: true

    # Voice Activity Detection (VAD)
    threshold_dbfs: -30.0
    threshold_flatness: 0.40
    pre_roll_frames: 10
    hangover_frames: 25
    min_speech_frames: 15

    # Speech-to-Text (Faster-Whisper)
    whisper_model: "deepdml/faster-whisper-large-v3-turbo-ct2"
    stt_fallback_model: "base.en"
    stt_language: "en"
    stt_beam_size: 2
    stt_no_speech_threshold: 0.6
    stt_log_prob_threshold: -1.0
    stt_compression_ratio_threshold: 1.8
    stt_vad_silence_ms: 400
    stt_vad_speech_pad_ms: 200
    stt_initial_prompt: "Hello robot, halo robot, follow me, please follow me, stop, we have arrived at the location, this is the location."
    stt_hotwords: "hello robot halo robot follow me arrived we are here stop berhenti"
    stt_hallucination_blacklist:
      - "terima kasih"
      - "terimakasih"
      - "thank you"
      - "thanks"
      - "thank you very much"
      - "you"

    # Text-to-Speech (Piper)
    tts_model: "en_US-lessac-medium.onnx"
    tts_use_cuda: false

    # Web Server & NLU (Standalone Barelang HRI Server)
    nlu_threshold: 0.68
    http_port: 8000
    ws_port: 8765
