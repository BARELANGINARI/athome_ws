# Single source of truth parameter untuk seluruh node athome_hri:
#   - barelang_hri_node / barelang_audio_bridge (help_me_carry_hri)
#   - stt_engine (stt_engine_node)
#   - tts_engine (tts_engine_node)
# Cukup ubah nilai di sini, seluruh node otomatis mengikuti.
/**:
  ros__parameters:
    # -------------------------------------------------------------------------
    # 1. Audio Input / Output (Perangkat Mikrofon, Speaker, & Tampilan Monitor)
    # -------------------------------------------------------------------------
    mic_device_index: -1                 # Indeks perangkat mic (-1 = auto-detect mic USB; untuk mic jack 3.5mm isi indeks soundcard)
    speaker_device_index: -1             # Indeks perangkat speaker (-1 = pakai speaker default sistem)
    enable_local_mic: true               # true = aktifkan mic yang terpasang langsung di robot/PC
    enable_ws_audio: true                # true = terima audio dari Web UI lewat WebSocket
    enable_visualizer: true              # true = tampilkan jendela grafik gelombang/spektrum VAD (false = matikan GUI)
    enable_live_meter: true              # true = tampilkan bar level suara [VAD] di terminal log
    enable_local_speaker: true           # true = putar suara TTS langsung lewat speaker lokal robot

    # -------------------------------------------------------------------------
    # 2. Voice Activity Detection / VAD (Penyaring awal suara vs hening di CPU)
    # -------------------------------------------------------------------------
    threshold_dbfs: -23.5               # Batas volume minimum (atau floor) agar suara dianggap ucapan
    threshold_flatness: 0.34                # Batas kerataan spektrum (0-1); lebih kecil = lebih ketat menolak noise datar (kipas/AC)
    adaptive_vad_enabled: true                # true = threshold dBFS otomatis mengikuti noise floor ruangan + adaptive_snr_margin_db
    adaptive_snr_margin_db: 7.0                 # Margin SNR (dB) di atas noise floor ruangan saat adaptive_vad_enabled=true
    pre_roll_frames: 15                  # Jumlah frame (x30 ms = 450 ms) yang ikut direkam SEBELUM suara terdeteksi agar awal kata tidak terpotong
    hangover_frames: 12                  # Lama jeda hening (x30 ms = 660 ms) sebelum sistem yakin kalimat selesai diucapkan
    min_speech_frames: 11                  # Durasi minimal ucapan (x30 ms = 150 ms) agar kata singkat tetap valid
    max_speech_frames: 250                 # Durasi maksimal 1 segmen ucapan (x30 ms = 7.5 detik) agar VAD tidak macet saat bising konstan

    # -------------------------------------------------------------------------
    # 3. Speech-to-Text / Faster-Whisper (Pengubah audio ucapan menjadi teks)
    # -------------------------------------------------------------------------
    whisper_model: "deepdml/faster-whisper-large-v3-turbo-ct2"  # Nama/path model Whisper utama yang dimuat ke GPU/CPU
    stt_fallback_model: "base.en"        # Model cadangan lebih ringan jika model utama gagal dimuat
    stt_language: "en"                   # Kode bahasa yang dikenali STT ("en" = Inggris, "id" = Indonesia)
    stt_sample_rate: 16000               # Sample rate audio input untuk Whisper (Hz)
    stt_beam_size: 2                   # Lebar pencarian kata (1-5); makin besar makin akurat, tapi proses sedikit lebih lambat
    stt_no_speech_threshold: 0.4                 # Batas probabilitas hening (0-1); jika probabilitas hening >= nilai ini, teks ditolak sebagai noise
    stt_log_prob_threshold: -0.65               # Batas keyakinan model (log-prob); jika di bawah nilai ini, hasil dianggap tidak yakin & dibuang
    stt_compression_ratio_threshold: 1.8 # Batas pengulangan kata; menolak halusinasi Whisper yang mengulang-ulang kalimat yang sama
    stt_vad_threshold: 0.78                # Silero VAD internal Whisper: ambang batas probabilitas suara (0-1)
    stt_vad_min_speech_ms: 120                 # Silero VAD internal Whisper: durasi minimal segmen ucapan (ms)
    stt_vad_silence_ms: 350                 # Silero VAD internal Whisper: jeda hening (ms) untuk memotong segmen di dalam rekaman
    stt_vad_speech_pad_ms: 300                 # Silero VAD internal Whisper: bantalan waktu (ms) di awal & akhir ucapan agar tidak terpotong
    stt_repetition_penalty: 1.15         # Penalti pengulangan token pada decoder Whisper (>1.0 untuk mencegah loop)
    stt_no_repeat_ngram_size: 3          # Larang pengulangan n-gram identik sepanjang N token pada decoder Whisper
    stt_temperature: 0.0                 # Temperatur decoding Whisper (0.0 = deterministik/greedy, hindari halusinasi acak)
    stt_denoiser_backend: "auto"              # Frontend denoiser CPU: "auto" (deepfilternet2 -> rnnoise -> spectral), "deepfilternet2", "rnnoise", "spectral", "none"
    stt_highpass_hz: 120.0               # Frekuensi cutoff High-Pass Filter (Hz) untuk buang rumble motor & proximity effect directional mic
    stt_dedup_max_ngram: 6                   # Panjang maksimal n-gram untuk post-processing deduplikasi frasa berulang berturut-turut
    # Dikosongkan untuk mencegah prompt leakage/pengulangan saat SNR rendah (andalkan stt_hotwords)
    stt_initial_prompt: ""
    # Daftar kata prioritas (dipisah spasi) yang bobot pengenalannya diperkuat oleh Whisper
    stt_hotwords: "hello robot halo robot follow me arrived we are here stop berhenti"
    # Daftar teks halusinasi yang otomatis dibuang jika Whisper mendeteksinya saat hening/noise
    stt_hallucination_blacklist:
      - "terima kasih"
      - "terimakasih"
      - "thank you"
      - "thanks"
      - "thank you very much"
      - "thank you so much"
      - "thanks for listening"
      - "please subscribe"
      - "you"
      - "bye"
      - "subtitles by"
      - "thanks for watching"
      - "uh"
      - "um"
      - "hmm"
      - "huh"
      - "oh"
      - "ah"
      - "music"
      - "applause"
      - "laughter"
      - "silence"
      - "blank audio"

    # -------------------------------------------------------------------------
    # 4. Text-to-Speech / Piper (Pengubah teks menjadi suara robot)
    # -------------------------------------------------------------------------
    tts_model: "en_US-lessac-medium.onnx" # Nama file model suara Piper (.onnx di folder model/)
    tts_use_cuda: false                   # true = jalankan Piper di GPU CUDA, false = jalankan di CPU (lebih hemat VRAM)
    tts_post_mute_sec: 0.8                 # Lama mic tetap dimute setelah /hri/tts_done agar gema/ekor speaker tidak terekam

    # -------------------------------------------------------------------------
    # 5. Web Server & NLU (Antarmuka web dan pencocokan intent)
    # -------------------------------------------------------------------------
    nlu_threshold: 0.68                  # Ambang batas kemiripan teks minimum (0-1) agar perintah suara diterima NLU
    http_port: 8000                      # Port server halaman web HMI
    ws_port: 8765                        # Port WebSocket untuk komunikasi audio/status real-time dengan web HMI
