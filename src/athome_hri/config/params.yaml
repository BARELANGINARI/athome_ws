barelang_hri_node:
  ros__parameters:
    mic_device_index: -1
    enable_local_mic: true
    enable_ws_audio: true
    enable_visualizer: true
    enable_live_meter: true
    threshold_dbfs: -30.0
    threshold_flatness: 0.40
    pre_roll_frames: 10
    hangover_frames: 25
    min_speech_frames: 15
    whisper_model: "deepdml/faster-whisper-large-v3-turbo-ct2"
    http_port: 8000
    ws_port: 8765

barelang_audio_bridge:
  ros__parameters:
    mic_device_index: -1
    enable_local_mic: true
    enable_ws_audio: true
    enable_visualizer: true
    enable_live_meter: true
    threshold_dbfs: -30.0
    threshold_flatness: 0.40
    pre_roll_frames: 10
    hangover_frames: 25
    min_speech_frames: 15
    whisper_model: "deepdml/faster-whisper-large-v3-turbo-ct2"
    http_port: 8000
    ws_port: 8765

stt_engine:
  ros__parameters:
    device_index: -1
    enable_live_meter: true
    threshold_dbfs: -30.0
    threshold_flatness: 0.40
    pre_roll_frames: 10
    hangover_frames: 25
    min_speech_frames: 15
    model: "deepdml/faster-whisper-large-v3-turbo-ct2"
    language: "en"

tts_engine:
  ros__parameters:
    model: "en_US-lessac-medium.onnx"
    enable_local_speaker: true
