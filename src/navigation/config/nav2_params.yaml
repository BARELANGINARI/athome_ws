# =====================================================================
# Nav2 Parameters
# - Sensor Input: Odometry Nucleo (/odom) & 2D LiDAR (/scan)
# - Geometri: Radius robot 0.22 m (diameter 0.44 m)
# - Lingkungan: Lorong tersempit 0.90 m (clearance tiap sisi 0.23 m)
# - Heading: Robot selalu menghadap ke depan/searah path (vy = 0, vx >= 0)
# - Global Costmap: static_layer murni (tanpa obstacle_layer yang menimbun ghost marks)
# - Collision Monitor: DINONAKTIFKAN (enabled: False, 1:1 pass-through cmd_vel)
# - AMCL: recovery_alpha aktif, alpha adaptif untuk mencegah scan lepas dari peta
# =====================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.3        # Fleksibilitas translasi yang pas untuk mengatasi slip odom tanpa drifting
    alpha4: 0.25       # Fleksibilitas rotasi
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    robot_model_type: "nav2_amcl::OmniMotionModel"
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 3.0    # Gradien tajam agar scan menempel presisi di dinding
    laser_max_range: 20.0
    laser_min_range: 0.10
    max_beams: 180                    # Sampel sinar ditingkatkan agar matching ke peta sangat kuat
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    # Recovery partikel acak diaktifkan: jika pose sempat bergeser di tengah jalan,
    # AMCL otomatis menyuntikkan partikel dan langsung menarik scan kembali menempel ke dinding
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    tf_broadcast: true
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # Threshold dinaikkan ke 1.75 rad (~100 deg): belokan biasa dilakukan sambil jalan.
      # Rotasi murni di tempat hanya aktif jika putar balik (> 100 deg s/d 180 deg).
      angular_dist_threshold: 1.75
      angular_disengage_threshold: 0.3925 # ~22.5 derajat
      forward_sampling_distance: 0.5   # Titik sampling arah path ke depan (meter)
      rotate_to_heading_angular_vel: 1.4 # Kecepatan rotasi ditempat saat putar balik dibuat mulus (rad/s)
      max_angular_accel: 2.0           # Akselerasi rotasi di tempat diperhalus (rad/s^2)
      simulate_ahead_time: 1.0         # Simulasi tabrakan saat rotasi (detik)
      rotate_to_goal_heading: true     # Rotasi ditempat ke heading akhir di goal pose

      # Parameter DWB Local Planner (Primary Controller)
      debug_trajectory_details: False
      # Robot omni 3-wheel: pergerakan halus (smooth)
      min_vel_x: 0.0
      max_vel_x: 0.30
      min_vel_y: -0.12
      max_vel_y: 0.12
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      max_vel_theta: 1.4
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_y: 1.0
      acc_lim_theta: 1.8
      decel_lim_x: -1.2
      decel_lim_y: -1.0
      decel_lim_theta: -1.8
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 25
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.25
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.8
      PathDist.scale: 28.0
      GoalDist.scale: 20.0
      # PathAlign diperhalus bobotnya dan forward_point_distance 0.20m agar tidak bergetar/hentak
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.20
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.45
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      # Hanya static_layer dan inflation_layer.
      # Tanpa obstacle_layer, global costmap murni mengikuti peta statis map.yaml
      # dan tidak akan pernah tertimbun 'jejak obstacle hantu' dari lidar.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 7.0
        inflation_radius: 0.45
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.25
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.12, 1.4]
    min_velocity: [0.0, -0.12, -1.4]
    max_accel: [1.2, 1.0, 1.8]
    max_decel: [-1.2, -1.0, -1.8]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.25
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Collision monitor dinonaktifkan sepenuhnya dengan enabled: False
    # (polygons dan scan tetap didefinisikan agar rclcpp tidak crash akibat untyped empty list)
    polygons: ["dummy"]
    dummy:
      type: "circle"
      action_type: "stop"
      radius: 0.01
      min_points: 999
      visualize: False
      enabled: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.05
      max_height: 2.0
      enabled: False

route_server:
  ros__parameters:
    use_sim_time: False
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

docking_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
