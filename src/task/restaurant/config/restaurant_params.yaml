# =============================================================================
# Restaurant Task Node Parameters
# =============================================================================
restaurant_node:
  ros__parameters:
    # -------------------------------------------------------------------------
    # 1. Homing / Origin Settings
    # -------------------------------------------------------------------------
    origin_x: 0.0                        # Koordinat X titik awal robot (meter)
    origin_y: 0.0                        # Koordinat Y titik awal robot (meter)
    origin_yaw: 0.0                      # Sudut hadap awal robot (rad)
    global_frame: "map"                  # Global map frame
    base_frame: "base_link"              # Robot base frame

    # -------------------------------------------------------------------------
    # 2. Customer Order / Person Navigation Settings
    # -------------------------------------------------------------------------
    order_topic: "/vision/order"           # Topik input posisi orang / pelanggan dari kamera
    order_frame: "base_link"             # Frame acuan koordinat: "base_link" (relatif kamera) atau "map" (global)
    standoff_distance: 0.85              # Jarak henti aman di depan pelanggan (meter)
    auto_navigate: false                 # false: tunggu service /go_to_order, true: langsung jalan saat topik publish
    nav_timeout_sec: 120.0               # Batas waktu navigasi Nav2 sebelum timeout (detik)

    # -------------------------------------------------------------------------
    # 3. Customer Search Rotation Settings
    # -------------------------------------------------------------------------
    search_sweep_angle_deg: 90.0         # Sudut rotasi pencarian kiri dan kanan (derajat)
    search_angular_speed: 0.35           # Kecepatan sudut rotasi pencarian (rad/s)
    search_hold_time_sec: 0.5            # Durasi diam sejenak di ujung kiri/kanan (detik)
    search_timeout_sec: 35.0             # Batas waktu timeout pencarian (detik)
    cmd_vel_topic: "/cmd_vel"            # Topik kecepatan robot
    gesture_topic: "/vision/gesture"     # Topik gestur dari kamera

    # -------------------------------------------------------------------------
    # 4. Heading Alignment to Person BBox Settings
    # -------------------------------------------------------------------------
    align_to_person_enabled: true        # Aktifkan penyesuaian arah hadap ke bbox orang setelah sampai di tujuan
    person_label_topic: "/vision/person_label" # Topik deteksi orang & bbox dari kamera
    align_timeout_sec: 10.0              # Batas waktu penyesuaian arah hadap (detik)
    align_tolerance_px: 30.0             # Toleransi selisih piksel tengah bbox terhadap tengah kamera (px)
    align_p_gain: 0.6                    # Proportional gain untuk kecepatan sudut rotasi
    align_min_speed: 0.12                # Kecepatan rotasi minimum untuk mengatasi friksi (rad/s)
    align_max_speed: 0.35                # Kecepatan rotasi maksimum (rad/s)
    camera_image_width: 672.0            # Lebar resolusi kamera dalam piksel (ZED VGA: 672 px)
    align_invert_direction: false        # Inversi arah putar (true jika kamera terpasang terbalik)
