# =============================================================================
# Restaurant Task Node Parameters
# =============================================================================
restaurant_node:
  ros__parameters:
    # 1. Homing / Origin Settings
    origin_x: 0.0                        # Posisi X awal
    origin_y: 0.0                        # Posisi Y awal
    origin_yaw: 1.5708                   # Sudut hadap awal (90 derajat dalam radian)
    global_frame: "map"                  # Frame peta global
    base_frame: "base_link"              # Frame dasar robot

    # 2. Customer Order / Person Navigation Settings
    order_topic: "/vision/order"         # Topik posisi order
    order_frame: "base_link"             # Frame koordinat order
    standoff_distance: 0.7               # Jarak henti pelanggan
    adaptive_standoff_enabled: true      # Jarak henti adaptif
    adaptive_standoff_min: 0.7           # Jarak adaptif minimal
    adaptive_standoff_max: 1.6           # Jarak adaptif maksimal
    adaptive_standoff_step: 0.05         # Langkah mundur adaptif
    costmap_obstacle_threshold: 60       # Ambang batas rintangan
    costmap_topic: "/global_costmap/costmap" # Topik costmap global
    robot_radius: 0.24                   # Radius fisik robot
    auto_navigate: false                 # Navigasi otomatis order
    nav_timeout_sec: 120.0               # Batas waktu navigasi

    # 3. Customer Search Rotation Settings
    search_sweep_angle_deg: 90.0         # Sudut sapuan pencarian
    search_angular_speed: 0.18           # Kecepatan putar pencarian
    search_hold_time_sec: 0.5            # Jeda ujung sapuan
    search_timeout_sec: 35.0             # Batas waktu pencarian
    cmd_vel_topic: "/cmd_vel"            # Topik kecepatan robot
    gesture_topic: "/vision/gesture"     # Topik gestur kamera

    # 4. Heading Alignment to Person BBox Settings
    align_to_person_enabled: true        # Luruskan ke pelanggan
    person_label_topic: "/vision/person_label" # Topik deteksi orang
    align_timeout_sec: 10.0              # Batas waktu pelurusan
    align_tolerance_px: 30.0             # Toleransi piksel tengah
    align_p_gain: 0.6                    # Gain putar pelurusan
    align_min_speed: 0.12                # Kecepatan putar minimal
    align_max_speed: 0.35                # Kecepatan putar maksimal
    camera_image_width: 672.0            # Lebar piksel kamera
    align_invert_direction: false        # Balik arah putar
    barman_max_distance: 0.75            # Jarak maks barman
    barman_search_angular_speed: 0.50    # Kecepatan cari barman
    barman_align_timeout_sec: 15.0       # Timeout lurus barman

# =============================================================================
# Restaurant Task Manager FSM Parameters
# =============================================================================
restaurant_manager:
  ros__parameters:
    origin_x: 0.0                        # Posisi X barman
    origin_y: 0.0                        # Posisi Y barman
    origin_yaw: 0.0                      # Sudut hadap awal
    capture_tf_origin_on_init: true      # Simpan posisi awal
    global_frame: "map"                  # Frame peta global
    base_frame: "base_link"              # Frame dasar robot
    order_frame: "base_link"             # Frame koordinat order
    customer_standoff_distance: 0.7      # Jarak henti pelanggan
    object_standoff_distance: 0.45       # Jarak henti meja
    adaptive_standoff_enabled: true      # Jarak henti adaptif
    adaptive_standoff_min: 0.7           # Jarak adaptif minimal
    adaptive_standoff_max: 1.6           # Jarak adaptif maksimal
    adaptive_standoff_step: 0.05         # Langkah mundur adaptif
    costmap_obstacle_threshold: 60       # Ambang batas rintangan
    costmap_topic: "/global_costmap/costmap" # Topik costmap global
    robot_radius: 0.24                   # Radius fisik robot
    nav_timeout_sec: 120.0               # Batas waktu navigasi
    order1_detect_timeout_sec: 8.0       # Timeout deteksi order1
    max_customers: 2                     # Maksimal jumlah pelanggan
    global_timeout_sec: 900.0            # Batas waktu task
    dialog_reprompt_sec: 10.0            # Jeda ulang dialog
    wave_reprompt_sec: 5.0               # Interval ajakan melambai
    tts_min_timeout_sec: 4.0             # Durasi min TTS
    tts_sec_per_word: 0.5                # Durasi per kata
    tts_timeout_margin_sec: 2.0          # Margin latensi TTS
    nav_retry_cooldown_sec: 2.0          # Jeda ulang navigasi
    tray_wait_sec: 5.0                   # Tunggu taruh tray
    tts_post_delay_sec: 0.25             # Jeda setelah TTS
