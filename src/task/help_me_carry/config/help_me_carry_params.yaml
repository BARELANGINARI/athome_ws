help_me_carry_node:
  ros__parameters:
    # 1. TOPICS & FRAMES
    person_topic: "/vision/person_label"      # Topik deteksi orang
    person_back_topic: "/vision/person_back"  # Topik orang membelakangi
    gesture_topic: "/vision/gesture"          # Topik gestur tunjuk
    bag_topic: "/vision/bag_detections"       # Topik deteksi tas
    yaw_topic: "/yaw"                         # Topik data yaw
    cmd_vel_topic: "/cmd_vel"                 # Topik kecepatan robot
    nav_cmd_vel_topic: "/nav_cmd_vel"         # Topik kecepatan Nav2
    path_topic: "/following_path"             # Topik jalur ikut
    plan_topic: "/plan"                       # Topik rencana global
    goal_update_topic: "/goal_update"         # Topik pembaruan tujuan
    action_name: "navigate_to_pose"           # Server aksi Nav2
    frame_map: "map"                          # Frame peta global
    frame_base: "base_link"                   # Frame dasar robot
    scan_topic: "/scan"                       # Topik scan LiDAR
    target_index: 0                           # Indeks target orang
    follow_bt_xml: ""                         # Path BT kustom

    # 2. FOLLOWING DISTANCES & TIMEOUTS
    strict_id_lock: true                      # Kunci ID target
    follow_stop_distance: 0.85                # Jarak berhenti ikut
    follow_start_distance: 1.00               # Jarak mulai ikut
    bag_stop_distance: 0.45                   # Jarak berhenti tas
    bag_frame_width: 672.0                    # Lebar frame tas
    bag_frame_height: 376.0                   # Tinggi frame tas
    bag_crosshair_x_offset_px: 0.0            # Offset X target
    bag_crosshair_y_offset_px: 0.0            # Offset Y target
    bag_center_deadband_px: 3.0               # Deadband tengah tas
    bag_align_tol_left_px: 8.0                # Toleransi kiri tas
    bag_align_tol_right_px: 8.0               # Toleransi kanan tas
    max_follow_range: 2.5                     # Jarak maks ikut
    max_lost_time: 3.0                        # Timeout target hilang
    occlusion_timeout: 1.5                    # Timeout prediksi oklusi

    # 3. VELOCITY LIMITS & PID GAINS
    min_vx: 0.08                              # Kecepatan maju minimal
    max_vx: 0.55                              # Kecepatan maju maksimal
    max_vy: 0.28                              # Kecepatan geser maksimal
    max_wz: 0.75                              # Kecepatan putar maksimal
    occlusion_max_vx: 0.30                    # Kecepatan saat oklusi
    kp_dist: 0.55                             # Gain jarak maju
    kp_yaw: 0.85                              # Gain sudut hadap
    kd_yaw: 0.15                              # Gain redaman sudut
    deadband_moving: 0.04                     # Deadband saat bergerak
    deadband_stop: 0.12                       # Deadband saat diam

    # 4. LOW-PASS FILTERING & SMOOTHING
    alpha_v: 0.35                             # Filter kecepatan linear
    alpha_w: 0.40                             # Filter kecepatan sudut
    bearing_beta: 0.35                        # Filter arah kamera

    # 5. LIDAR OBSTACLE & SAFETY CORRIDOR
    enable_avoidance: true                    # Aktifkan hindar rintangan
    obstacle_distance: 0.85                   # Jarak mulai perlambat
    footprint_radius: 0.24                    # Radius bodi robot
    min_stop_x: 0.48                          # Jarak rem darurat
    corridor_width: 0.32                      # Lebar koridor aman
    bypass_theta_offset_deg: 10.0             # Sudut hindar samping
    peeking_avoid_dist: 1.10                  # Jarak intip halangan
    peeking_strafe_speed: 0.22                # Kecepatan geser intip
    peeking_timeout: 4.0                      # Timeout manuver intip

    # 6. KALMAN FILTER TUNING & LIDAR FUSION
    enable_lidar_fusion: true                 # Aktifkan fusi LiDAR
    kf_lidar_noise: 0.25                      # Noise pengukuran LiDAR
    lidar_leg_gate: 0.60                      # Gate kluster kaki
    min_lidar_fusion_dist: 1.2                # Jarak min fusi
    kf_process_noise: 1.2                     # Noise proses Kalman
    kf_measurement_noise: 0.15                # Noise ukur Kalman

    # 7. STEP BACK (MUNDUR) PARAMETERS
    step_back_person_distance: 1.6            # Jarak mundur orang
    step_back_speed: 0.25                     # Kecepatan gerak mundur
    step_back_timeout: 30.0                   # Timeout gerak mundur
    step_back_target_bags: 2                  # Target jumlah tas
    step_back_bag_keep_sec: 1.0               # Jeda mundur tas

    # 8. HOMING QUEUEING & SEARCH
    homing_queue_enabled: true                # Aktifkan antri pulang
    homing_queue_search_enabled: true         # Aktifkan sapuan antrian
    homing_queue_start_delay: 5.0             # Jeda awal pulang
    homing_queue_distance: 1.20               # Jarak henti antrian
    homing_queue_resume_distance: 2.00        # Jarak lanjut pulang
    homing_queue_corridor: 1.20               # Lebar koridor antrian
    homing_queue_max_detect_dist: 2.50        # Jarak maks antrian
    homing_queue_min_persons: 2               # Jumlah min antrian
    homing_queue_inter_dist: 2.00             # Jarak antar orang
    homing_queue_crawl_speed: 0.14            # Kecepatan maju antrian
    homing_queue_wait_duration: 60.0          # Durasi tunggu antrian
    homing_queue_clear_hysteresis: 3.0        # Jeda antrian kosong
    homing_timeout: 300.0                     # Batas waktu pulang

    # 9. LIDAR SPECKLE / OUTLIER FILTER
    filtered_scan_topic: "/scan_filtered"     # Topik scan bersih
    speckle_filter_enabled: true              # Aktifkan filter noise
    speckle_min_points: 3                     # Titik min kluster
    speckle_neighbor_dist: 0.15               # Jarak antar titik
    speckle_max_range: 12.0                   # Jarak maks filter

# =============================================================
# 9. HELP ME CARRY MANAGER (TASK FSM ORCHESTRATOR)
# =============================================================
help_me_carry_manager:
  ros__parameters:
    global_timeout_sec: 600.0                 # Batas waktu task
    operator_timeout_sec: 5.0                 # Timeout operator hilang
    follow_grace_period_sec: 2.0              # Masa tenggang awal
    arrived_grace_period_sec: 5.0             # Masa tenggang tiba
    tts_min_timeout_sec: 4.0                  # Durasi min TTS
    tts_sec_per_word: 0.5                     # Durasi per kata
    tts_timeout_margin_sec: 2.0               # Margin latensi TTS
    follow_prompt_interval_sec: 3.0           # Interval pengingat ikut
    lifter_move_wait_sec: 3.0                 # Tunggu gerak lifter

help_me_carry_orchestrator:
  ros__parameters:
    global_timeout_sec: 600.0                 # Batas waktu task
    operator_timeout_sec: 5.0                 # Timeout operator hilang
    follow_grace_period_sec: 2.0              # Masa tenggang awal
    arrived_grace_period_sec: 5.0             # Masa tenggang tiba
    tts_min_timeout_sec: 4.0                  # Durasi min TTS
    tts_sec_per_word: 0.5                     # Durasi per kata
    tts_timeout_margin_sec: 2.0               # Margin latensi TTS
    follow_prompt_interval_sec: 3.0           # Interval pengingat ikut
    lifter_move_wait_sec: 3.0                 # Tunggu gerak lifter
