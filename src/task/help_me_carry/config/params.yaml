help_me_carry_node:
  ros__parameters:
    # -------------------------------------------------------------
    # 1. TOPICS & FRAMES
    # -------------------------------------------------------------
    person_topic: "/zed/person_label"         # Topic for ZED person detections
    gesture_topic: "/zed/gesture"             # Topic for pointing gesture detections
    bag_topic: "/zed/bag_detections"          # Topic for YOLO paper bag detections
    yaw_topic: "/zed/yaw_deg"                 # Topic for IMU yaw data
    cmd_vel_topic: "/cmd_vel"                 # Topic for base velocity commands
    path_topic: "/following_path"             # Topic for RViz following trajectory
    goal_update_topic: "/goal_update"         # Topic for Nav2 dynamic goal updates
    action_name: "navigate_to_pose"           # Nav2 NavigateToPose action server
    frame_map: "map"                          # Global map frame
    frame_base: "base_link"                   # Robot base frame
    follow_bt_xml: ""                         # Custom Nav2 BT XML path (empty = auto-detect)

    # -------------------------------------------------------------
    # 2. FOLLOWING DISTANCES & TIMEOUTS
    # -------------------------------------------------------------
    strict_id_lock: false                     # False: gunakan filter spasial kontinuitas (anti-hijack) agar tidak terkecoh switch ID di vision
    follow_stop_distance: 0.85                # Distance to stop following (meters)
    follow_start_distance: 1.00               # Distance to start moving forward (meters)
    bag_stop_distance: 0.45                   # Distance to stop in front of bag (meters)
    max_follow_range: 2.5                     # Max detection range to follow (meters, filters background crowd)
    max_lost_time: 3.0                        # Watchdog safety timeout before reset (seconds)
    occlusion_timeout: 1.5                    # Kalman dead-reckoning window on occlusion (seconds)

    # -------------------------------------------------------------
    # 3. VELOCITY LIMITS & PID GAINS
    # -------------------------------------------------------------
    min_vx: 0.08                              # Minimum forward speed when moving (m/s)
    max_vx: 0.32                              # Maximum forward speed (m/s)
    max_vy: 0.22                              # Maximum lateral strafe speed (m/s)
    max_wz: 0.40                              # Maximum angular rotation speed (rad/s)
    occlusion_max_vx: 0.22                    # Capped forward speed during Kalman dead-reckoning (m/s)
    kp_dist: 0.45                             # Proportional gain for forward distance error
    kp_yaw: 0.75                              # Proportional gain for yaw heading error
    kd_yaw: 0.15                              # Derivative damping gain for yaw rate
    deadband_moving: 0.04                     # Heading deadband when robot is moving (rad, ~2.3 deg)
    deadband_stop: 0.12                       # Heading deadband when robot is stopped (rad, ~6.9 deg)

    # -------------------------------------------------------------
    # 4. LOW-PASS FILTERING & SMOOTHING
    # -------------------------------------------------------------
    alpha_v: 0.35                             # Slew-rate smoothing factor for linear velocities (0-1)
    alpha_w: 0.40                             # Slew-rate smoothing factor for angular velocity (0-1)
    bearing_beta: 0.35                        # Low-pass filter weight for raw vision bearing (0-1)

    # -------------------------------------------------------------
    # 5. LIDAR OBSTACLE & SAFETY CORRIDOR
    # -------------------------------------------------------------
    enable_avoidance: true                    # Enable real-time LiDAR obstacle avoidance
    obstacle_distance: 0.75                   # Distance threshold to start slowing down (meters)
    footprint_radius: 0.24                    # Robot self-footprint radius filter (meters)
    min_stop_x: 0.38                          # Hard safety braking distance from robot center (meters)
    corridor_width: 0.32                      # Front danger corridor half-width (|y| in meters)
    bypass_theta_offset_deg: 10.0             # Diagonal yaw offset during lateral bypass (degrees)
    peeking_avoid_dist: 1.10                  # Distance threshold to trigger peeking avoidance when person occluded (meters)
    peeking_strafe_speed: 0.22                # Lateral strafe speed during peeking (m/s)
    peeking_timeout: 4.0                      # Max duration for peeking avoidance maneuver before timeout (seconds)

    # -------------------------------------------------------------
    # 6. KALMAN FILTER TUNING & LIDAR FUSION
    # -------------------------------------------------------------
    enable_lidar_fusion: true                 # Enable 360 LiDAR leg tracking fallback
    min_lidar_fusion_dist: 1.2                # Min distance for LiDAR fusion (meters, ignores strangers <1.2m)
    kf_process_noise: 1.2                     # Kalman process noise covariance (motion uncertainty)
    kf_measurement_noise: 0.15                # Kalman measurement noise standard deviation (meters)

    # -------------------------------------------------------------
    # 7. STEP BACK (MUNDUR) PARAMETERS
    # -------------------------------------------------------------
    step_back_person_distance: 2.0            # Target distance to person to stop moving back (meters)
    step_back_speed: 0.15                     # Backward speed magnitude (m/s)
    step_back_timeout: 15.0                   # Max duration for step back motion (seconds)

    # -------------------------------------------------------------
    # 8. HOMING QUEUEING (ANTRI DI BELAKANG ORANG SAAT HOMING)
    # -------------------------------------------------------------
    homing_queue_enabled: true                # Aktifkan perilaku antri di belakang orang saat /homing
    homing_queue_distance: 0.90               # Jarak berhenti di belakang orang dalam antrian (meter)
    homing_queue_resume_distance: 1.30        # Jarak ketika orang mulai menjauh / antrian maju (meter)
    homing_queue_corridor: 0.45               # Setengah lebar koridor deteksi orang di depan path (|y| meter)
    homing_queue_max_detect_dist: 2.20        # Jarak maksimal pemantauan orang di depan robot (meter)
    homing_queue_crawl_speed: 0.12            # Kecepatan merayap maju mengikuti antrian saat orang melangkah (m/s)
    homing_queue_clear_hysteresis: 1.0        # Durasi bebas orang sebelum antrian dilepas dan Nav2 jalan penuh (detik)
    homing_timeout: 300.0                     # Batas waktu maksimal eksekusi navigasi homing (detik)
