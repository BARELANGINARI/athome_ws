receptionist_node:
  ros__parameters:
    # Waypoints
    door:
      x: 0.5
      y: 0.0
      yaw: 180.0
    beverage_area:
      x: 1.9
      y: 1.9
      yaw: 270.0
    living_room:
      x: 2.0
      y: 0.0
      yaw: 270.0

    # Operational settings
    global_frame: "map"
    announce_topic: "/receptionist/status"

    # Search chair settings
    cmd_vel_topic: "cmd_vel"
    chair_topic: "/zed/chair_detections"
    empty_seat_topic: "/zed/empty_seat"
    search_chair_angular_speed: 0.35
    search_chair_timeout_sec: 40.0
    search_chair_confirm_frames: 2
    align_chair_p_gain: 1.2
    align_chair_min_speed: 0.14
    align_chair_max_speed: 0.28
    align_chair_tolerance_rad: 0.07
    camera_width: 672

receptionist_manager:
  ros__parameters:
    host:
      name: "Alex"
      drink: "Coke"
      interest: "Robotics"
    camera_width: 672
