receptionist_node:
  ros__parameters:
    # Waypoints
    door:
      x: 0.5
      y: 0.0
      yaw: 180.0
      # x : 5.0
      # y : 4.0
      # yaw : 1.4
    beverage_area:
      x: 1.9
      y: 1.9
      yaw: 270.0
      # x: 2.28
      # y: 0.5
      # yaw: 2.1
    living_room:
      x: 2.0
      y: 0.0
      yaw: 270.0
      # x: 1.7
      # y: 0.0
      # yaw: -1.5

    # Operational settings
    global_frame: "map"
    announce_topic: "/receptionist/status"

    # Search chair settings
    cmd_vel_topic: "cmd_vel"
    chair_topic: "/vision/chair_detections"
    empty_seat_topic: "/vision/empty_seat"
    odom_topic: "/odom"
    search_chair_ref_yaw: -1.57
    search_chair_angular_speed: 0.30
    search_chair_timeout_sec: 40.0
    search_chair_confirm_frames: 2
    search_chair_sweep_angle_deg: 30.0
    chair_max_dist: 3.0
    align_chair_p_gain: 1.2
    align_chair_min_speed: 0.14
    align_chair_max_speed: 0.28
    align_chair_tolerance_rad: 0.07
    camera_width: 672

    guest_door_distance: 1.0
    guest_door_step_back_speed: 0.16
    guest_door_timeout_sec: 15.0

    # Face person settings
    host_name: "Alex"
    person_label_topic: "/vision/person_label"
    guest_1_name_topic: "/vision/guest_1_name"
    guest_2_name_topic: "/vision/guest_2_name"
    host_seated_max_dist: 3.0
    face_person_angular_speed: 0.30
    face_person_timeout_sec: 25.0
    face_person_p_gain: 1.2
    face_person_min_speed: 0.14
    face_person_max_speed: 0.30
    face_person_tolerance_rad: 0.07

    # Relative 90-degree turn settings (/receptionist/left dan /receptionist/right)
    turn_90_angular_speed: 0.30
    turn_90_min_speed: 0.14
    turn_90_max_speed: 0.35
    turn_90_tolerance_rad: 0.04
    turn_90_timeout_sec: 8.0
    turn_90_p_gain: 1.5

receptionist_manager:
  ros__parameters:
    host:
      name: "Alex"
      drink: "Coke"
      interest: "Robotics"
      gender: "male"
      shirt_color: "black"
      hair_color: "black"
    camera_width: 672
    global_timeout_sec: 600.0
    dialog_reprompt_sec: 12.0
    wait_guest_prompt_sec: 8.0
    vision_initial_settle_sec: 1.2
    min_sit_wait_sec: 4.0
    person_freshness_sec: 2.0
    tts_min_timeout_sec: 4.0
    tts_sec_per_word: 0.5
    tts_timeout_margin_sec: 2.0
    nav_retry_cooldown_sec: 2.0
