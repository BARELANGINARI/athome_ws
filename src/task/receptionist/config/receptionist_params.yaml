receptionist_node:
  ros__parameters:
    # Waypoints
    door:
      x: 0.0
      y: 0.0
      yaw: 180.0
    beverage_area:
      x: 1.5
      y: 1.5
      yaw: 90.0
    living_room:
      x: 1.5
      y: 0.0
      yaw: 90.0
    living_room_center:
      x: 2.0
      y: 0.0
      yaw: 0.0

    # Operational settings
    global_frame: "map"
    announce_topic: "/receptionist/status"
    wall_proximity_threshold: 0.48
    escape_distance: 0.35
    escape_speed: 0.12
    enable_open_space_escape: true

receptionist_manager:
  ros__parameters:
    host:
      name: "Alex"
      drink: "Coke"
      interest: "Robotics"
    camera_width: 672
