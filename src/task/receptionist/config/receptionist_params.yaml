receptionist_node:
  ros__parameters:
    # Waypoints
    door:
      x: 1.33                              # Posisi X pintu
      y: 0.0                               # Posisi Y pintu
      yaw: 180.0                           # Sudut hadap pintu
    beverage_area:
      x: 1.9                               # Posisi X minuman
      y: 2.1                               # Posisi Y minuman
      yaw: 270.0                           # Sudut hadap minuman
    living_room:
      x: 2.4                               # Posisi X tamu
      y: -0.25                             # Posisi Y tamu
      yaw: -130.0                          # Sudut hadap tamu

    # Operational settings
    global_frame: "map"                    # Frame peta global
    announce_topic: "/receptionist/status" # Topik status task
    nav_timeout_sec: 45.0                  # Batas waktu navigasi

    # Search chair settings
    cmd_vel_topic: "cmd_vel"               # Topik kecepatan robot
    chair_topic: "/vision/chair_detections" # Topik deteksi kursi
    empty_seat_topic: "/vision/empty_seat" # Topik kursi kosong
    odom_topic: "/odom"                    # Topik odometri robot
    search_chair_ref_yaw: -1.57            # Sudut acuan kursi
    search_chair_angular_speed: 0.12       # Kecepatan putar kursi (lebih lambat agar tidak motion blur)
    search_chair_timeout_sec: 75.0         # Timeout cari kursi
    search_chair_confirm_frames: 2         # Frame konfirmasi kursi
    search_chair_sweep_angle_deg: 30.0     # Sudut sapuan kursi
    chair_max_dist: 3.0                    # Jarak maksimal kursi
    align_chair_p_gain: 1.5                # Gain lurus kursi
    align_chair_min_speed: 0.10            # Kecepatan min kursi
    align_chair_max_speed: 0.20            # Kecepatan maks kursi
    align_chair_tolerance_rad: 0.035       # Toleransi sudut kursi
    camera_width: 1280                     # Lebar piksel kamera

    guest_door_distance: 1.5               # Jarak tamu pintu
    guest_door_distance_min: 1.35          # Jarak min pintu
    guest_door_step_back_speed: 0.22       # Kecepatan mundur pintu
    guest_door_timeout_sec: 15.0           # Timeout mundur pintu
    guest_door_align_tolerance: 0.07       # Toleransi lurus pintu
    guest_approach_distance: 0.7           # Jarak dekati tamu
    guest_approach_speed: 0.50             # Kecepatan dekati tamu
    guest_approach_timeout_sec: 15.0       # Timeout dekati tamu

    # Face person settings
    host_name: "Yesaya"                    # Nama host utama
    person_label_topic: "/vision/person_label" # Topik deteksi orang
    guest_1_name_topic: "/vision/guest_1_name" # Topik nama tamu1
    guest_2_name_topic: "/vision/guest_2_name" # Topik nama tamu2
    host_seated_max_dist: 2.0              # Jarak maks host
    face_person_angular_speed: 0.30        # Kecepatan hadap orang
    face_person_timeout_sec: 25.0          # Timeout hadap orang
    face_person_p_gain: 1.2                # Gain hadap orang
    face_person_min_speed: 0.15            # Kecepatan min orang
    face_person_max_speed: 0.30            # Kecepatan maks orang
    face_person_tolerance_rad: 0.045       # Toleransi sudut orang

    # Relative 90-degree turn settings
    turn_90_angular_speed: 0.30            # Kecepatan belok kanan/kiri
    turn_90_min_speed: 0.14                # Kecepatan min belok
    turn_90_max_speed: 0.55                # Kecepatan maks belok
    turn_90_tolerance_rad: 0.04            # Toleransi sudut belok
    turn_90_timeout_sec: 15.0              # Timeout belok robot
    turn_90_p_gain: 1.5                    # Gain belok robot

