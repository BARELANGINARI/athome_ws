vision:
  ros__parameters:
    task: "receptionist"                   # Mode task vision
    camera_fps: 30.0                       # Frame rate kamera
    camera_resolution: "hd720"             # Resolusi kamera ZED
    depth_mode: "performance"              # Mode kedalaman ZED
    publish_yaw: false                     # Publikasi yaw IMU
    yaw_360: true                          # Format yaw 0-360
    depth_minimum_distance: 30.0           # Jarak depth minimal
    person_max_dist: 2.0                   # Jarak maks orang
    enable_body_tracking: true             # Aktifkan tracking tubuh
    enable_chair: true                     # Aktifkan deteksi kursi
    chair_model: ""                        # Path model kursi
    chair_max_dist: 3.0                    # Jarak maks kursi (meter)
    enable_drinks: true                    # Aktifkan deteksi minuman
    botol_model: "models/receptionist/water.onnx" # Model botol air
    soda_model: "models/receptionist/soda.onnx" # Model kaleng soda
    milk_model: "models/receptionist/milk.onnx" # Model kotak susu
    drink_min_area: 180.0                  # Luas min minuman
    drink_conf: 0.48                       # Ambang skor minuman
    water_conf: 0.25                       # Ambang skor air
    drink_max_dist: 2.5                    # Jarak maks minuman
    enable_bag: false                      # Nonaktifkan deteksi tas
    enable_yolo: true                      # Aktifkan detektor YOLO
    yolo_model: "models/receptionist/yolov8n_sim.onnx" # Model YOLO utama
    yolo_classes: "models/receptionist/coco_names.txt" # Label kelas YOLO
    yolo_conf: 0.20                        # Ambang skor YOLO
    yolo_stride: 2                         # Interval frame inferensi YOLO (lebih responsif saat rotate)
    face_detect_model: "models/receptionist/face_detection_yunet.onnx" # Model deteksi wajah
    face_detect_conf: 0.40                 # Ambang skor wajah
    face_model: "models/receptionist/arcface_w600k_r50.onnx" # Model pengenalan wajah
    face_threshold: 0.40                   # Ambang kemiripan wajah
    gender_model: "models/receptionist/genderage.onnx" # Model deteksi gender
    color_model: "models/receptionist/color_model.onnx" # Model warna pakaian
    color_labels: "models/receptionist/color_names.txt" # Label warna pakaian
    hair_model: "models/receptionist/hair_model.onnx" # Model warna rambut
    hair_labels: "models/receptionist/hair_names.txt" # Label warna rambut
    hat_model: "models/receptionist/hat.onnx" # Model deteksi topi
    glasses_model: "models/receptionist/glasses.onnx" # Model deteksi kacamata
    accessory_conf: 0.18               # Confidence threshold deteksi topi & kacamata (YOLO-World)
    debug_window: true                     # Tampilkan jendela preview
    mirror: false                          # Cermin tampilan preview
    host_name: "Yesaya"                    # Nama host utama
    host_photo: "models/receptionist/host.jpg" # Foto wajah host
    host_shirt_color: ""                   # Warna baju host
    host_gender: ""                        # Gender profil host
    host_hair_color: ""                    # Warna rambut host

