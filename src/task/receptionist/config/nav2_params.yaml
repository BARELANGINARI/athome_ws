# ---------------------------------------------------------------------
# 1. AMCL (Adaptive Monte Carlo Localization)
# ---------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: False                  # Real clock (not simulation)
    alpha1: 0.2                          # Rotation noise from rotation
    alpha2: 0.2                          # Rotation noise from translation
    alpha3: 0.3                          # Translation noise from translation (slip compensation)
    alpha4: 0.25                         # Translation noise from rotation
    alpha5: 0.2                          # Translation noise for omni model
    base_frame_id: "base_link"           # Robot base frame
    global_frame_id: "map"               # Global map frame
    odom_frame_id: "odom"                # Odometry frame
    scan_topic: "scan"                   # 2D LiDAR scan input topic
    robot_model_type: "nav2_amcl::OmniMotionModel" # 3-wheel omni motion model
    laser_model_type: "likelihood_field" # Laser matching model
    laser_likelihood_max_dist: 3.0       # Max laser matching distance (m)
    laser_max_range: 20.0                # Max laser range (m)
    laser_min_range: 0.10                # Min laser range (m)
    max_beams: 180                       # Laser beams used per scan
    min_particles: 500                   # Min particle count
    max_particles: 2000                  # Max particle count
    pf_err: 0.05                         # Particle filter error
    pf_z: 0.99                           # Particle distribution quantile
    recovery_alpha_fast: 0.1             # Fast recovery rate (random particle injection)
    recovery_alpha_slow: 0.001           # Slow recovery rate
    update_min_d: 0.10                   # Min translation before update (m)
    update_min_a: 0.10                   # Min angular change before update (rad)
    resample_interval: 1                 # Resampling interval
    tf_broadcast: true                   # Broadcast map -> odom TF
    transform_tolerance: 1.0             # TF transform tolerance (s)
    set_initial_pose: true               # Set initial pose on start
    initial_pose:
      x: 0.0                             # Initial X position (m)
      y: 0.0                             # Initial Y position (m)
      z: 0.0                             # Initial Z position (m)
      yaw: 0.0                           # Initial yaw orientation (rad)

# ---------------------------------------------------------------------
# 2. BEHAVIOR TREE NAVIGATOR
# ---------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: False                  # Real clock
    global_frame: map                    # Global map frame
    robot_base_frame: base_link          # Robot base frame
    odom_topic: /odom                    # Odometry topic
    bt_loop_duration: 10                 # BT loop duration (ms)
    default_server_timeout: 20           # Default server timeout (ms)
    wait_for_service_timeout: 1000       # Wait for service timeout (ms)
    action_server_result_timeout: 900.0  # Action result timeout (s)
    navigators: ["navigate_to_pose", "navigate_through_poses"] # Active navigators
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator" # Single goal navigator
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator" # Multi-goal navigator
    error_code_names:                    # Error codes for recovery
      - compute_path_error_code
      - follow_path_error_code

# ---------------------------------------------------------------------
# 3. CONTROLLER SERVER (DWB Local Planner)
# ---------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: False                  # Real clock
    controller_frequency: 20.0           # Velocity calculation frequency (Hz)
    min_x_velocity_threshold: 0.001      # Min X velocity threshold (m/s)
    min_y_velocity_threshold: 0.001      # Min Y velocity threshold (m/s)
    min_theta_velocity_threshold: 0.001  # Min angular velocity threshold (rad/s)
    failure_tolerance: 0.3               # Controller failure tolerance (s)
    progress_checker_plugins: ["progress_checker"] # Progress checker plugin
    goal_checker_plugins: ["general_goal_checker"] # Goal checker plugin
    controller_plugins: ["FollowPath"]   # Active controller plugin

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker" # Stuck detection plugin
      required_movement_radius: 0.15     # Required movement radius (m)
      movement_time_allowance: 15.0      # Movement time allowance (s)

    general_goal_checker:
      stateful: True                     # Stateful goal checking
      plugin: "nav2_controller::SimpleGoalChecker" # Goal checker plugin
      xy_goal_tolerance: 0.15            # Goal XY position tolerance (m)
      yaw_goal_tolerance: 0.35           # Goal yaw orientation tolerance (rad)

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner" # DWB local planner (omni)

      # DWB Local Planner Parameters (3-wheel omni)
      debug_trajectory_details: False    # Debug trajectory logging
      min_vel_x: 0.0                     # Min forward velocity (m/s, prevent reverse)
      max_vel_x: 0.30                    # Max forward velocity (m/s)
      min_vel_y: -0.12                   # Min lateral strafe velocity (m/s)
      max_vel_y: 0.12                    # Max lateral strafe velocity (m/s)
      min_speed_xy: 0.0                  # Min translational speed (m/s)
      max_speed_xy: 0.30                 # Max translational speed (m/s)
      max_vel_theta: 0.8                 # Max angular velocity (rad/s)
      min_speed_theta: 0.0               # Min angular velocity (rad/s)
      acc_lim_x: 1.2                     # Translation X acceleration limit (m/s^2)
      acc_lim_y: 1.0                     # Translation Y acceleration limit (m/s^2)
      acc_lim_theta: 1.2                 # Angular acceleration limit (rad/s^2)
      decel_lim_x: -1.2                  # Translation X deceleration limit (m/s^2)
      decel_lim_y: -1.0                  # Translation Y deceleration limit (m/s^2)
      decel_lim_theta: -1.2              # Angular deceleration limit (rad/s^2)
      vx_samples: 20                     # VX velocity samples
      vy_samples: 5                      # VY velocity samples
      vtheta_samples: 25                 # Vtheta velocity samples
      sim_time: 2.0                      # Trajectory simulation time (s)
      linear_granularity: 0.05           # Linear simulation step (m)
      angular_granularity: 0.025         # Angular simulation step (rad)
      transform_tolerance: 0.25          # TF transform tolerance (s)
      xy_goal_tolerance: 0.15            # Goal XY tolerance (m)
      trans_stopped_velocity: 0.05       # Stopped translational velocity threshold (m/s)
      short_circuit_trajectory_evaluation: True # Skip evaluation if trajectory collides
      stateful: True                     # Maintain state between iterations
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"] # Trajectory critics
      BaseObstacle.scale: 0.25           # Obstacle proximity penalty weight
      PathDist.scale: 32.0               # Global path following weight
      GoalDist.scale: 24.0               # Goal approach weight
      PathAlign.scale: 16.0              # Path heading alignment weight
      PathAlign.forward_point_distance: 0.20 # Forward evaluation point distance (m)
      GoalAlign.scale: 20.0              # Goal heading alignment weight
      GoalAlign.forward_point_distance: 0.20 # Goal evaluation point distance (m)
      RotateToGoal.scale: 32.0           # Final goal rotation weight
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ---------------------------------------------------------------------
# 4. LOCAL COSTMAP (Sensor-based Dynamic Costmap)
# ---------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0              # Update frequency (Hz)
      publish_frequency: 2.0             # Publish frequency (Hz)
      global_frame: odom                 # Local costmap reference frame
      robot_base_frame: base_link        # Robot base frame
      use_sim_time: False                # Real clock
      rolling_window: true               # Rolling window following robot
      width: 4                           # Costmap width (m)
      height: 4                          # Costmap height (m)
      resolution: 0.05                   # Grid resolution (m/cell)
      robot_radius: 0.22                 # Robot footprint radius (m, diameter 0.44m)
      transform_tolerance: 0.3           # TF transform tolerance (s)
      plugins: ["obstacle_layer", "inflation_layer"] # Active costmap layers
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # 2D LiDAR dynamic obstacle layer
        enabled: True                    # Enable obstacle layer
        observation_sources: scan        # Sensor observation source
        scan:
          topic: /scan                   # 2D LiDAR topic
          max_obstacle_height: 2.0       # Max obstacle height (m)
          clearing: True                 # Clear free space along laser rays
          marking: True                  # Mark obstacle cells on laser hit
          data_type: "LaserScan"         # ROS 2 message type
          raytrace_max_range: 3.5        # Max raytracing range (m)
          raytrace_min_range: 0.0        # Min raytracing range (m)
          obstacle_max_range: 3.0        # Max obstacle marking range (m)
          obstacle_min_range: 0.0        # Min obstacle marking range (m)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Safety buffer layer around obstacles
        cost_scaling_factor: 10.0        # Exponential cost decay factor
        inflation_radius: 0.35           # Inflation radius (m)
      always_send_full_costmap: True     # Send full costmap on publish

# ---------------------------------------------------------------------
# 5. GLOBAL COSTMAP (Map-based Costmap)
# ---------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0              # Update frequency (Hz)
      publish_frequency: 1.0             # Publish frequency (Hz)
      global_frame: map                  # Global map frame
      robot_base_frame: base_link        # Robot base frame
      use_sim_time: False                # Real clock
      robot_radius: 0.22                 # Robot footprint radius (m)
      resolution: 0.05                   # Grid resolution (m/cell)
      track_unknown_space: false         # Allow traversal across unmapped space
      transform_tolerance: 0.5           # TF transform tolerance (s)
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # Costmap layers
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # Static map layer from map_server
        map_subscribe_transient_local: True # Transient local QoS for map
        subscribe_to_updates: True       # Subscribe to /map_updates during SLAM
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # Dynamic LiDAR obstacle layer
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Wall & obstacle inflation layer
        cost_scaling_factor: 10.0        # Exponential cost decay factor
        inflation_radius: 0.35           # Inflation radius (m)
      always_send_full_costmap: True     # Send full costmap on publish

# ---------------------------------------------------------------------
# 6. MAP SERVER
# ---------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: False                  # Real clock

# ---------------------------------------------------------------------
# 7. PLANNER SERVER (Global Path Planner / Navfn)
# ---------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0     # Expected replanning frequency (Hz)
    use_sim_time: False                  # Real clock
    planner_plugins: ["GridBased"]       # Planner plugin
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # Global path planner algorithm
      tolerance: 2.0                     # Search tolerance around blocked goal (m)
      use_astar: false                   # Use Dijkstra for reliable traversal of unknown space
      allow_unknown: true                # Allow planning through unknown space

# ---------------------------------------------------------------------
# 8. SMOOTHER SERVER (Global Path Smoother)
# ---------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: False                  # Real clock
    smoother_plugins: ["simple_smoother"] # Smoother plugins
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" # Path corner smoothing plugin
      tolerance: 1.0e-10                 # Convergence tolerance
      max_its: 1000                      # Max smoothing iterations
      do_refinement: True                # Refine smoothed path curvature

# ---------------------------------------------------------------------
# 9. BEHAVIOR SERVER (Recovery Behaviors)
# ---------------------------------------------------------------------
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw         # Obstacle costmap topic
    footprint_topic: local_costmap/published_footprint # Robot footprint topic
    cycle_frequency: 10.0                # Recovery loop frequency (Hz)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] # Recovery actions
    spin:
      plugin: "nav2_behaviors::Spin"     # In-place spin recovery
    backup:
      plugin: "nav2_behaviors::BackUp"   # Backward drive recovery
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading" # Straight drive recovery
    wait:
      plugin: "nav2_behaviors::Wait"     # Wait recovery
    global_frame: odom                   # Recovery reference frame
    robot_base_frame: base_link          # Robot base frame
    transform_tolerance: 0.25            # TF transform tolerance (s)
    use_sim_time: False                  # Real clock
    simulate_ahead_time: 2.0             # Forward collision check time (s)
    max_rotational_vel: 1.4              # Max spin velocity (rad/s)
    min_rotational_vel: 0.4              # Min spin velocity (rad/s)
    rotational_acc_lim: 2.0              # Spin angular acceleration limit (rad/s^2)

# ---------------------------------------------------------------------
# 10. WAYPOINT FOLLOWER
# ---------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: False                  # Real clock
    loop_rate: 20                        # Waypoint loop rate (Hz)
    stop_on_failure: false               # Continue to next waypoint on failure
    waypoint_task_executor_plugin: "wait_at_waypoint" # Waypoint arrival task
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint" # Waypoint wait plugin
      enabled: True                      # Enable pause at waypoint
      waypoint_pause_duration: 200       # Pause duration at waypoint (ms)

# ---------------------------------------------------------------------
# 11. VELOCITY SMOOTHER (cmd_vel Filtering)
# ---------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: False                  # Real clock
    smoothing_frequency: 20.0            # Output smoothing frequency (Hz)
    scale_velocities: True               # Scale velocities when limits hit
    feedback: "OPEN_LOOP"                # Open-loop velocity estimation
    max_velocity: [0.30, 0.12, 1.4]      # Max velocity limits [vx, vy, vtheta]
    min_velocity: [0.0, -0.12, -1.4]     # Min velocity limits [vx, vy, vtheta]
    max_accel: [1.2, 1.0, 1.8]           # Max acceleration limits [ax, ay, atheta]
    max_decel: [-1.2, -1.0, -1.8]        # Max deceleration limits [dx, dy, dtheta]
    odom_topic: "odom"                   # Odometry input topic
    odom_duration: 0.1                   # Odometry time window (s)
    deadband_velocity: [0.0, 0.0, 0.0]   # Deadband velocity [vx, vy, vtheta]
    velocity_timeout: 1.0                # Command timeout (s)

# ---------------------------------------------------------------------
# 12. COLLISION MONITOR (Bypassed / Pass-through)
# ---------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: False                  # Real clock
    base_frame_id: "base_footprint"      # Base footprint frame
    odom_frame_id: "odom"                # Odometry frame
    cmd_vel_in_topic: "cmd_vel_smoothed" # Input velocity topic
    cmd_vel_out_topic: "cmd_vel"         # Output velocity topic
    state_topic: "collision_monitor_state" # Monitor state topic
    transform_tolerance: 0.25            # TF tolerance (s)
    source_timeout: 1.0                  # Sensor timeout (s)
    base_shift_correction: True          # Robot center shift correction
    stop_pub_timeout: 2.0                # Stop publishing timeout (s)
    polygons: ["dummy"]                  # Polygon list (dummy to prevent crash)
    dummy:
      type: "circle"                     # Safety zone type
      action_type: "stop"                # Action on obstacle entry
      radius: 0.01                       # Zone radius (m)
      min_points: 999                    # Trigger points count
      visualize: False                   # Visualize in RViz
      enabled: False                     # Disabled (pass-through)
    observation_sources: ["scan"]        # Observation source
    scan:
      type: "scan"                       # 2D scan type
      topic: "scan"                      # LiDAR scan topic
      min_height: 0.05                   # Min height (m)
      max_height: 2.0                    # Max height (m)
      enabled: False                     # Disabled scan monitoring

# ---------------------------------------------------------------------
# 13. ROUTE SERVER
# ---------------------------------------------------------------------
route_server:
  ros__parameters:
    use_sim_time: False                  # Real clock
    boundary_radius_to_achieve_node: 1.0 # Boundary node achievement radius (m)
    radius_to_achieve_node: 2.0          # Node achievement radius (m)
    smooth_corners: true                 # Smooth corners between nodes
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"] # Active operations
    ReroutingService:
      plugin: "nav2_route::ReroutingService" # Rerouting plugin
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit" # Speed limit adjustment plugin
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor" # Collision monitor plugin
      max_collision_dist: 3.0            # Collision warning distance (m)
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"] # Edge cost functions
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer" # Distance-based scoring
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer" # Costmap-based scoring

# ---------------------------------------------------------------------
# 14. DOCKING SERVER
# ---------------------------------------------------------------------
docking_server:
  ros__parameters:
    use_sim_time: False                  # Real clock
    controller_frequency: 50.0           # Docking loop frequency (Hz)
    initial_perception_timeout: 5.0      # Perception timeout (s)
    wait_charge_timeout: 5.0             # Wait charging detection timeout (s)
    dock_approach_timeout: 30.0          # Approach timeout (s)
    undock_linear_tolerance: 0.05        # Undocking position tolerance (m)
    undock_angular_tolerance: 0.1        # Undocking angular tolerance (rad)
    max_retries: 3                       # Max docking retries
    base_frame: "base_link"              # Robot base frame
    fixed_frame: "odom"                  # Docking reference frame
    dock_backwards: false                # Dock forward-facing
    dock_prestaging_tolerance: 0.5       # Prestaging tolerance (m)
    dock_plugins: ['simple_charging_dock'] # Active dock plugins
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock' # Charging dock plugin
      docking_threshold: 0.05            # Final docking tolerance (m)
      staging_x_offset: -0.7             # Staging point offset (m)
      use_external_detection_pose: true  # Use external pose estimate from vision
      use_battery_status: false          # Do not wait for battery status
      use_stall_detection: false         # Disable motor stall detection
      external_detection_timeout: 1.0    # Detection timeout (s)
      external_detection_translation_x: -0.18 # Detection X offset (m)
      external_detection_translation_y: 0.0   # Detection Y offset (m)
      external_detection_rotation_roll: -1.57 # Detection roll offset (rad)
      external_detection_rotation_pitch: -1.57 # Detection pitch offset (rad)
      external_detection_rotation_yaw: 0.0   # Detection yaw offset (rad)
      filter_coef: 0.1                   # Low-pass filter coefficient
    controller:
      k_phi: 3.0                         # Heading control gain
      k_delta: 2.0                       # Lateral control gain
      v_linear_min: 0.15                 # Min linear docking speed (m/s)
      v_linear_max: 0.15                 # Max linear docking speed (m/s)
      use_collision_detection: true      # Enable collision detection
      costmap_topic: "local_costmap/costmap_raw" # Costmap topic
      footprint_topic: "local_costmap/published_footprint" # Footprint topic
      transform_tolerance: 0.1           # TF tolerance (s)
      projection_time: 5.0               # Projection time (s)
      simulation_step: 0.1               # Simulation step (s)
      dock_collision_threshold: 0.3      # Collision threshold (m)

# ---------------------------------------------------------------------
# 15. SLAM TOOLBOX (Real-time Online SLAM)
# ---------------------------------------------------------------------
slam_toolbox:
  ros__parameters:
    use_sim_time: false                  # Real clock
    odom_frame: odom                     # Odometry frame
    map_frame: map                       # Global map frame
    base_frame: base_link                # Robot base frame
    scan_topic: /scan                    # 2D LiDAR topic
    mode: mapping                        # Real-time online mapping mode

    transform_publish_period: 0.02       # Map->odom TF publish period (s, 50 Hz)
    map_update_interval: 0.5             # Map publish update interval (s)
    minimum_time_interval: 0.2           # Min interval between scans (s)
    transform_timeout: 0.2               # TF transform timeout (s)
    tf_buffer_duration: 30.0             # TF buffer duration (s)

    minimum_travel_distance: 0.05        # Min translation before new scan (m)
    minimum_travel_heading: 0.05         # Min rotation before new scan (rad)
    scan_queue_size: 10                  # Scan queue size
    throttle_scans: 1                    # Process every N scans (1 = all)

    resolution: 0.05                     # Map cell resolution (m)
    max_laser_range: 12.0                # Max mapping laser range (m)
