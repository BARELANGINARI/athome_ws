rplidar_node:
  ros__parameters:
    serial_port: /dev/ttyUSB1
    serial_baudrate: 256000
    frame_id: laser_frame
    scan_mode: Standard
    angle_compensate: true

/**:
  ros__parameters:
    filter1:
      name: angle_360_full
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -3.14159
        upper_angle: 3.14159
        replace_with_nan: true
        wrap_angle: false
