# ---------------------------------------------------------------------
# 1. AMCL (Adaptive Monte Carlo Localization)
# ---------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata, bukan simulasi
    alpha1: 0.2                          # Noise rotasi akibat gerakan rotasi robot
    alpha2: 0.2                          # Noise rotasi akibat gerakan translasi robot
    alpha3: 0.3                          # Noise translasi akibat translasi (kompensasi slip odom)
    alpha4: 0.25                         # Noise translasi akibat rotasi robot
    alpha5: 0.2                          # Noise translasi untuk model omni
    base_frame_id: "base_link"           # Frame pusat robot
    global_frame_id: "map"               # Frame koordinat peta global
    odom_frame_id: "odom"                # Frame odometri robot
    scan_topic: "scan"                   # Topik input laser scan 2D LiDAR
    robot_model_type: "nav2_amcl::OmniMotionModel" # Model kinematika omni (3 roda)
    laser_model_type: "likelihood_field" # Model pencocokan sinar laser ke peta
    laser_likelihood_max_dist: 3.0       # Jarak maksimum toleransi matching laser (m)
    laser_max_range: 20.0                # Jarak jangkauan maksimum laser (m)
    laser_min_range: 0.10                # Jarak jangkauan minimum laser (m)
    max_beams: 180                       # Jumlah sinar laser per scan untuk matching
    min_particles: 500                   # Jumlah partikel filter minimum
    max_particles: 2000                  # Jumlah partikel filter maksimum
    pf_err: 0.05                         # Batas kesalahan filter partikel
    pf_z: 0.99                           # Densitas kuantil distribusi partikel
    recovery_alpha_fast: 0.1             # Laju pemulihan cepat (injeksi partikel acak)
    recovery_alpha_slow: 0.001           # Laju pemulihan lambat (stabilitas partikel)
    update_min_d: 0.10                   # Jarak translasi minimum sebelum update filter (m)
    update_min_a: 0.10                   # Perubahan sudut minimum sebelum update filter (rad)
    resample_interval: 1                 # Interval resampling partikel per update
    tf_broadcast: true                   # Publish transformasi TF map -> odom
    transform_tolerance: 1.0             # Toleransi latensi transformasi TF (detik)
    set_initial_pose: true               # Aktifkan set initial pose saat start
    initial_pose:
      x: 0.0                             # Posisi awal X robot di peta (m)
      y: 0.0                             # Posisi awal Y robot di peta (m)
      z: 0.0                             # Posisi awal Z robot di peta (m)
      yaw: 0.0                           # Orientasi awal robot di peta (rad)

# ---------------------------------------------------------------------
# 2. BEHAVIOR TREE NAVIGATOR
# ---------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    global_frame: map                    # Frame koordinat global
    robot_base_frame: base_link          # Frame pusat robot
    odom_topic: /odom                    # Topik input odometri
    bt_loop_duration: 10                 # Durasi eksekusi loop BT (ms)
    default_server_timeout: 20           # Timeout default request action/service BT (ms)
    wait_for_service_timeout: 1000       # Timeout tunggu service aktif (ms)
    action_server_result_timeout: 900.0  # Timeout tunggu hasil action Nav2 selesai (detik)
    navigators: ["navigate_to_pose", "navigate_through_poses"] # Navigator yang aktif
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator" # Plugin navigasi ke single pose
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator" # Plugin rute banyak pose
    error_code_names:                    # Nama kode error untuk pemulihan kegagalan
      - compute_path_error_code
      - follow_path_error_code

# ---------------------------------------------------------------------
# 3. CONTROLLER SERVER (Eksekusi Jalur & DWB Local Planner)
# ---------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    controller_frequency: 20.0           # Frekuensi perhitungan kontrol kecepatan (Hz)
    min_x_velocity_threshold: 0.001      # Ambang kecepatan minimum X (m/s)
    min_y_velocity_threshold: 0.001      # Ambang kecepatan minimum Y (m/s)
    min_theta_velocity_threshold: 0.001  # Ambang kecepatan minimum angular (rad/s)
    failure_tolerance: 0.3               # Batas toleransi kegagalan kontroler (detik)
    progress_checker_plugins: ["progress_checker"] # Plugin pemantau kemajuan robot
    goal_checker_plugins: ["general_goal_checker"] # Plugin pemantau apakah goal tercapai
    controller_plugins: ["FollowPath"]   # Plugin controller utama

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker" # Deteksi apakah robot macet/terjebak
      required_movement_radius: 0.15     # Radius gerakan wajib dicapai dalam batas waktu (m, toleransi lorong sempit)
      movement_time_allowance: 15.0      # Batas waktu tunggu pergerakan sebelum dianggap macet (detik)

    general_goal_checker:
      stateful: True                     # Cek goal berbasis status bertahap
      plugin: "nav2_controller::SimpleGoalChecker" # Plugin cek toleransi sampai tujuan
      xy_goal_tolerance: 0.15            # Toleransi posisi akhir terhadap goal (m) presisi
      yaw_goal_tolerance: 0.35           # Toleransi sudut akhir terhadap goal (rad)

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner" # Controller lokal utama DWB (langsung tanpa wrapper RotationShim)

      # Parameter DWB Local Planner (Omni 3-wheel)
      debug_trajectory_details: False    # Tampilkan log detail trajektori (debug)
      min_vel_x: 0.0                     # Kecepatan minimum maju (m/s, vy=0 cegah mundur)
      max_vel_x: 0.30                    # Kecepatan maksimum maju (m/s)
      min_vel_y: -0.12                   # Kecepatan minimum lateral/geser kanan (m/s)
      max_vel_y: 0.12                    # Kecepatan maksimum lateral/geser kiri (m/s)
      min_speed_xy: 0.0                  # Kecepatan translasi gabungan minimum (m/s)
      max_speed_xy: 0.30                 # Kecepatan translasi gabungan maksimum (m/s)
      max_vel_theta: 0.8                 # Kecepatan rotasi angular maksimum (rad/s, dibatasi agar tidak putar mendadak)
      min_speed_theta: 0.0               # Kecepatan rotasi angular minimum (rad/s)
      acc_lim_x: 1.2                     # Batas akselerasi translasi X (m/s^2)
      acc_lim_y: 1.0                     # Batas akselerasi translasi Y (m/s^2)
      acc_lim_theta: 1.2                 # Batas akselerasi rotasi angular (rad/s^2)
      decel_lim_x: -1.2                  # Batas deselerasi/pengereman X (m/s^2)
      decel_lim_y: -1.0                  # Batas deselerasi/pengereman Y (m/s^2)
      decel_lim_theta: -1.2              # Batas deselerasi/pengereman rotasi (rad/s^2)
      vx_samples: 20                     # Jumlah sampel kecepatan X yang dievaluasi
      vy_samples: 5                      # Jumlah sampel kecepatan Y yang dievaluasi
      vtheta_samples: 25                 # Jumlah sampel kecepatan angular yang dievaluasi
      sim_time: 2.0                      # Durasi proyeksi trajektori ke depan (detik)
      linear_granularity: 0.05           # Resolusi langkah evaluasi garis lurus (m)
      angular_granularity: 0.025         # Resolusi langkah evaluasi rotasi (rad)
      transform_tolerance: 0.25          # Toleransi keterlambatan TF (detik)
      xy_goal_tolerance: 0.15            # Toleransi posisi goal XY (m) presisi
      trans_stopped_velocity: 0.05       # Ambang batas kecepatan dianggap berhenti (m/s)
      short_circuit_trajectory_evaluation: True # Lewati evaluasi jika trajektori sudah menabrak
      stateful: True                     # Pertahankan status evaluasi antar siklus
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"] # Pembobotan trajektori
      BaseObstacle.scale: 0.25           # Bobot penalti mendekati rintangan (diturunkan agar bisa melewati lorong sempit 90cm)
      PathDist.scale: 32.0               # Bobot kedekatan trajektori ke jalur global (prioritaskan maju di jalur)
      GoalDist.scale: 24.0               # Bobot jarak menuju titik tujuan (prioritaskan maju ke goal)
      PathAlign.scale: 16.0              # Bobot keselarasan orientasi robot terhadap jalur
      PathAlign.forward_point_distance: 0.20 # Jarak titik acuan di depan robot untuk evaluasi heading (m)
      GoalAlign.scale: 20.0              # Bobot keselarasan orientasi robot terhadap goal (menghadap ke orang)
      GoalAlign.forward_point_distance: 0.20 # Jarak titik acuan di depan robot untuk evaluasi heading goal (m)
      RotateToGoal.scale: 32.0           # Bobot rotasi menuju orientasi akhir goal saat dekat goal
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ---------------------------------------------------------------------
# 4. LOCAL COSTMAP (Costmap Dinamis Berbasis Sensor LiDAR)
# ---------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0              # Frekuensi update costmap lokal dari sensor (Hz)
      publish_frequency: 2.0             # Frekuensi publikasi costmap lokal ke topik (Hz)
      global_frame: odom                 # Frame acuan costmap lokal
      robot_base_frame: base_link        # Frame pusat robot
      use_sim_time: False                # Gunakan clock sistem nyata
      rolling_window: true               # Jendela costmap selalu bergerak mengikuti robot
      width: 4                           # Lebar jendela costmap lokal (m)
      height: 4                          # Tinggi jendela costmap lokal (m)
      resolution: 0.05                   # Ukuran grid cell (5 cm per sel)
      robot_radius: 0.22                 # Jari-jari lingkaran robot (m, diameter 44 cm)
      transform_tolerance: 0.3           # Toleransi latensi transformasi TF (detik)
      plugins: ["obstacle_layer", "inflation_layer"] # Layer costmap lokal
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # Layer deteksi rintangan dinamis dari LiDAR
        enabled: True                    # Aktifkan deteksi rintangan lokal
        observation_sources: scan        # Sumber sensor observasi
        scan:
          topic: /scan                   # Topik 2D LiDAR
          max_obstacle_height: 2.0       # Ketinggian maksimum rintangan yang dicatat (m)
          clearing: True                 # Bersihkan rintangan jika sinar laser menembus bebas
          marking: True                  # Tandai sel sebagai rintangan jika ada pantulan laser
          data_type: "LaserScan"         # Tipe pesan ROS 2
          raytrace_max_range: 3.5        # Jarak maksimum penembusan sinar laser clearing (m)
          raytrace_min_range: 0.0        # Jarak minimum penembusan sinar laser (m)
          obstacle_max_range: 3.0        # Jarak maksimum penandaan rintangan (m)
          obstacle_min_range: 0.4        # Jarak minimum penandaan rintangan (m)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Layer buffer keamanan di sekitar rintangan
        cost_scaling_factor: 10.0        # Penurunan eksponensial cost bahaya di sekitar rintangan (cepat turun di luar 0.22m)
        inflation_radius: 0.35           # Radius batas pengaruh bahaya rintangan (m, menyisakan 20cm bebas cost di tengah lorong 90cm)
      always_send_full_costmap: True     # Kirim full costmap ke subscriber tiap update

# ---------------------------------------------------------------------
# 5. GLOBAL COSTMAP (Costmap Peta Statis)
# ---------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0              # Frekuensi update costmap global (Hz)
      publish_frequency: 1.0             # Frekuensi publikasi costmap global (Hz)
      global_frame: map                  # Frame acuan peta global
      robot_base_frame: base_link        # Frame pusat robot
      use_sim_time: False                # Gunakan clock sistem nyata
      robot_radius: 0.22                 # Jari-jari lingkaran robot (m, diameter 44 cm)
      resolution: 0.05                   # Ukuran grid cell costmap (m)
      track_unknown_space: false         # Biarkan area tak terpetakan dilewati (penting untuk SLAM / person following)
      transform_tolerance: 0.5           # Toleransi latensi transformasi TF (detik)
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"] # Layer statis, rintangan dinamis LiDAR, & inflasi
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer" # Muat peta statis dari map_server (/map)
        map_subscribe_transient_local: True # Dukung QoS Transient Local peta Nav2
        subscribe_to_updates: True       # Berlangganan /map_updates saat Online SLAM aktif
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer" # Deteksi rintangan dinamis LiDAR agar planner global mencari rute alternatif
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.4
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer" # Layer jarak aman dari dinding & rintangan
        cost_scaling_factor: 10.0        # Faktor penurunan nilai cost bahaya
        inflation_radius: 0.35           # Radius batas bahaya di sekitar dinding peta (m, menyisakan 20cm bebas cost di tengah lorong 90cm)
      always_send_full_costmap: True     # Kirim costmap penuh tiap publish

# ---------------------------------------------------------------------
# 6. MAP SERVER
# ---------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata

# ---------------------------------------------------------------------
# 7. PLANNER SERVER (Perencana Jalur Global / Navfn)
# ---------------------------------------------------------------------
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0     # Target frekuensi perencanaan ulang jalur (Hz)
    use_sim_time: False                  # Gunakan clock sistem nyata
    planner_plugins: ["GridBased"]       # Plugin perencana global
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # Algoritma perencana jalur global
      tolerance: 2.0                     # Toleransi pencarian jalur ke titik sekitar jika goal terhalang (m)
      use_astar: false                   # Gunakan Dijkstra agar handal melintasi unknown space tanpa gagal
      allow_unknown: true                # Izinkan jalur melintasi area yang belum terpetakan (unknown)

# ---------------------------------------------------------------------
# 8. SMOOTHER SERVER (Penghalus Jalur Global)
# ---------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    smoother_plugins: ["simple_smoother"] # Plugin penghalus jalur
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" # Penghalus sudut belokan jalur
      tolerance: 1.0e-10                 # Batas toleransi konvergensi penghalusan
      max_its: 1000                      # Jumlah iterasi maksimum penghalusan jalur
      do_refinement: True                # Lakukan iterasi penyempurnaan kelengkungan jalur

# ---------------------------------------------------------------------
# 9. BEHAVIOR SERVER (Perilaku Pemulihan / Recovery)
# ---------------------------------------------------------------------
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw         # Topik costmap untuk verifikasi rintangan
    footprint_topic: local_costmap/published_footprint # Topik footprint robot
    cycle_frequency: 10.0                # Frekuensi eksekusi aksi pemulihan (Hz)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"] # Aksi recovery yang tersedia
    spin:
      plugin: "nav2_behaviors::Spin"     # Pemulihan putar badan di tempat
    backup:
      plugin: "nav2_behaviors::BackUp"   # Pemulihan mundur saat terhalang
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading" # Pemulihan maju lurus dengan arah tertentu
    wait:
      plugin: "nav2_behaviors::Wait"     # Pemulihan diam menunggu sejenak
    global_frame: odom                   # Frame acuan pemulihan
    robot_base_frame: base_link          # Frame pusat robot
    transform_tolerance: 0.25            # Toleransi keterlambatan TF (detik)
    use_sim_time: False                  # Gunakan clock sistem nyata
    simulate_ahead_time: 2.0             # Waktu simulasi tabrakan saat aksi recovery (detik)
    max_rotational_vel: 1.4              # Kecepatan putar maksimum saat recovery spin (rad/s)
    min_rotational_vel: 0.4              # Kecepatan putar minimum saat recovery spin (rad/s)
    rotational_acc_lim: 2.0              # Akselerasi rotasi saat spin (rad/s^2)

# ---------------------------------------------------------------------
# 10. WAYPOINT FOLLOWER
# ---------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    loop_rate: 20                        # Frekuensi loop navigasi antar waypoint (Hz)
    stop_on_failure: false               # Lanjut ke waypoint berikutnya jika satu titik gagal
    waypoint_task_executor_plugin: "wait_at_waypoint" # Aksi saat tiba di waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint" # Plugin jeda di tiap waypoint
      enabled: True                      # Aktifkan jeda waktu di waypoint
      waypoint_pause_duration: 200       # Durasi jeda di waypoint (milidetik)

# ---------------------------------------------------------------------
# 11. VELOCITY SMOOTHER (Penghalus Perintah Kecepatan cmd_vel)
# ---------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    smoothing_frequency: 20.0            # Frekuensi filtering output cmd_vel (Hz)
    scale_velocities: True               # Pertahankan rasio linear/angular saat kena limit akselerasi
    feedback: "OPEN_LOOP"                # Estimasi kecepatan open-loop (tanpa feedback odom lag)
    max_velocity: [0.30, 0.12, 1.4]      # Batas kecepatan maksimum [vx, vy, vtheta]
    min_velocity: [0.0, -0.12, -1.4]     # Batas kecepatan minimum [vx, vy, vtheta]
    max_accel: [1.2, 1.0, 1.8]           # Batas akselerasi maksimum [ax, ay, atheta]
    max_decel: [-1.2, -1.0, -1.8]        # Batas deselerasi/pengereman [dx, dy, dtheta]
    odom_topic: "odom"                   # Topik input odometri
    odom_duration: 0.1                   # Jendela waktu pembacaan odom (detik)
    deadband_velocity: [0.0, 0.0, 0.0]   # Zona mati kecepatan [vx, vy, vtheta]
    velocity_timeout: 1.0                # Timeout berhenti jika tidak ada perintah baru (detik)

# ---------------------------------------------------------------------
# 12. COLLISION MONITOR (Bypass / Dinonaktifkan)
# ---------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    base_frame_id: "base_footprint"      # Frame dasar robot
    odom_frame_id: "odom"                # Frame odometri
    cmd_vel_in_topic: "cmd_vel_smoothed" # Topik input kecepatan
    cmd_vel_out_topic: "cmd_vel"         # Topik output kecepatan akhir ke base driver
    state_topic: "collision_monitor_state" # Topik status monitor tabrakan
    transform_tolerance: 0.25            # Toleransi TF (detik)
    source_timeout: 1.0                  # Timeout pembacaan sensor (detik)
    base_shift_correction: True          # Koreksi pergeseran pusat robot
    stop_pub_timeout: 2.0                # Timeout penghentian publish stop (detik)
    polygons: ["dummy"]                  # Daftar poligon (dummy untuk cegah crash rclcpp)
    dummy:
      type: "circle"                     # Tipe area pengaman
      action_type: "stop"                # Aksi saat rintangan masuk area
      radius: 0.01                       # Ukuran radius area (m)
      min_points: 999                    # Jumlah titik trigger
      visualize: False                   # Tampilkan poligon di RViz
      enabled: False                     # Nonaktifkan monitor tabrakan (pass-through)
    observation_sources: ["scan"]        # Sumber observasi
    scan:
      type: "scan"                       # Tipe sensor scan 2D
      topic: "scan"                      # Topik laser LiDAR
      min_height: 0.05                   # Ketinggian minimum (m)
      max_height: 2.0                    # Ketinggian maksimum (m)
      enabled: False                     # Nonaktifkan scan collision monitor

# ---------------------------------------------------------------------
# 13. ROUTE SERVER
# ---------------------------------------------------------------------
route_server:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    boundary_radius_to_achieve_node: 1.0 # Jarak batas pencapaian simpul rute (m)
    radius_to_achieve_node: 2.0          # Jarak pencapaian simpul rute (m)
    smooth_corners: true                 # Haluskan belokan sudut antar simpul rute
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"] # Operasi route server
    ReroutingService:
      plugin: "nav2_route::ReroutingService" # Plugin pengalihan rute alternatif
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit" # Plugin penyesuaian limit kecepatan rute
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor" # Plugin monitor tabrakan rute
      max_collision_dist: 3.0            # Jarak peringatan tabrakan (m)
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"] # Fungsi pembobot segmen rute
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer" # Pembobot berbasis panjang jarak
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer" # Pembobot berbasis costmap

# ---------------------------------------------------------------------
# 14. DOCKING SERVER
# ---------------------------------------------------------------------
docking_server:
  ros__parameters:
    use_sim_time: False                  # Gunakan clock sistem nyata
    controller_frequency: 50.0           # Frekuensi loop kontrol docking (Hz)
    initial_perception_timeout: 5.0      # Batas waktu persepsi awal docking (detik)
    wait_charge_timeout: 5.0             # Batas waktu tunggu deteksi pengisian daya (detik)
    dock_approach_timeout: 30.0          # Batas waktu manuver pendekatan dock (detik)
    undock_linear_tolerance: 0.05        # Toleransi posisi saat undocking (m)
    undock_angular_tolerance: 0.1        # Toleransi sudut saat undocking (rad)
    max_retries: 3                       # Batas maksimal percobaan docking ulang
    base_frame: "base_link"              # Frame pusat robot
    fixed_frame: "odom"                  # Frame acuan docking
    dock_backwards: false                # Docking menghadap depan, bukan mundur
    dock_prestaging_tolerance: 0.5       # Toleransi posisi sebelum masuk jalur docking (m)
    dock_plugins: ['simple_charging_dock'] # Plugin docking yang digunakan
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock' # Plugin standar docking pengisian daya
      docking_threshold: 0.05            # Ambang toleransi jarak docking final (m)
      staging_x_offset: -0.7             # Jarak titik persiapan sebelum dock (m)
      use_external_detection_pose: true  # Gunakan estimasi pose eksternal dari kamera/sensor
      use_battery_status: false          # Jangan tunggu notifikasi status baterai
      use_stall_detection: false         # Nonaktifkan deteksi motor stall
      external_detection_timeout: 1.0    # Timeout deteksi eksternal (detik)
      external_detection_translation_x: -0.18 # Offset deteksi X (m)
      external_detection_translation_y: 0.0   # Offset deteksi Y (m)
      external_detection_rotation_roll: -1.57 # Offset rotasi roll deteksi (rad)
      external_detection_rotation_pitch: -1.57 # Offset rotasi pitch deteksi (rad)
      external_detection_rotation_yaw: 0.0   # Offset rotasi yaw deteksi (rad)
      filter_coef: 0.1                   # Koefisien filter low-pass pose deteksi
    controller:
      k_phi: 3.0                         # Gain kontrol sudut orientasi docking
      k_delta: 2.0                       # Gain kontrol simpangan lateral docking
      v_linear_min: 0.15                 # Kecepatan linear minimum saat docking (m/s)
      v_linear_max: 0.15                 # Kecepatan linear maksimum saat docking (m/s)
      use_collision_detection: true      # Pantau kemungkinan tabrakan saat docking
      costmap_topic: "local_costmap/costmap_raw" # Topik costmap rintangan
      footprint_topic: "local_costmap/published_footprint" # Topik footprint robot
      transform_tolerance: 0.1           # Toleransi TF (detik)
      projection_time: 5.0               # Waktu proyeksi trajektori docking (detik)
      simulation_step: 0.1               # Langkah waktu simulasi trajektori (detik)
      dock_collision_threshold: 0.3      # Jarak ambang tabrakan saat docking (m)

# ---------------------------------------------------------------------
# 15. SLAM TOOLBOX (Online SLAM Real-time)
# ---------------------------------------------------------------------
slam_toolbox:
  ros__parameters:
    use_sim_time: false                  # Gunakan clock sistem nyata
    odom_frame: odom                     # Frame odometri robot
    map_frame: map                       # Frame peta global yang dibangun
    base_frame: base_link                # Frame pusat robot
    scan_topic: /scan                    # Topik sensor LiDAR 2D
    mode: mapping                        # Mode mapping real-time (online slam)

    transform_publish_period: 0.02       # Periode publish TF map->odom (detik, 50 Hz)
    map_update_interval: 0.5             # Interval update peta ke topik /map (detik)
    minimum_time_interval: 0.2           # Interval waktu minimal antar penambahan scan (detik)
    transform_timeout: 0.2               # Toleransi batas waktu TF transform (detik)
    tf_buffer_duration: 30.0             # Durasi buffer TF history (detik)

    minimum_travel_distance: 0.05        # Jarak translasi minimum sebelum scan baru diproses (m)
    minimum_travel_heading: 0.05         # Rotasi heading minimum sebelum scan baru diproses (rad)
    scan_queue_size: 10                  # Ukuran antrean pemrosesan scan
    throttle_scans: 1                    # Proses setiap N scan (1 = proses semua scan)

    resolution: 0.05                     # Resolusi grid sel peta (5 cm per sel)
    max_laser_range: 12.0                # Jarak jangkauan maksimum laser yang dipetakan (m)
