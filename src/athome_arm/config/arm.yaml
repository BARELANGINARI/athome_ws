arm_motion_server:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 1000000
    motions_dir: ""  

    update_rate_hz: 50
    max_speed_dps: 60.0
    work_range_deg: 260.0

    gripper:
      id: 6
      max_open_deg: 110.0
      default_release_deg: 110.0
      closing_speed: 60
      load_threshold: 170
      step_ticks: 4
      step_ms: 40
      stall_ticks: 15
      squeeze_ticks: 20
      confirm_count: 3
      compliance_slope: 50

    # calibration:
    #   servo_1: { center_tick: 802, cw_limit: 10, ccw_limit: 1010 }
    #   servo_4: { center_tick: 809, cw_limit: 10, ccw_limit: 1010 }
    #   servo_5: { center_tick: 221, cw_limit: 10, ccw_limit: 1010 }
    #   servo_6: { center_tick: 506, cw_limit: 491, ccw_limit: 779 }

    calibration:
      servo_1: { center_tick: 521, cw_limit: 10, ccw_limit: 1010 }
      servo_4: { center_tick: 185, cw_limit: 10, ccw_limit: 1010 }
      servo_5: { center_tick: 834, cw_limit: 10, ccw_limit: 1010 }
      servo_6: { center_tick: 348, cw_limit: 333, ccw_limit: 730 }

    ik:
      enabled: true
      l1_m: 0.21                      # Panjang link 1 (poros ID 4/5 ke poros ID 1) = 21 cm
      l2_m: 0.075                     # Panjang link 2 (poros ID 1 ke titik tengah gripper ID 6) = 7.5 cm
      shoulder_x_m: 0.13              # Jarak maju poros bahu pada sumbu X vision (meter)
      shoulder_z_m: 0.61              # Tinggi poros bahu pada sumbu Z vision (0.44 m kamera + 0.17 m = 0.61 m)
      j1_zero_offset_deg: 90.0        # Sudut fisik link 1 saat servo J1 berada di 0.0 deg
      j2_zero_offset_deg: 0.0         # Sudut fisik link 2 relatif link 1 saat servo J2 berada di 0.0 deg
      j1_sign: -1.0                   # -1.0 karena arah maju J1 bernilai negatif
      j2_sign: 1.0                    # +1.0 atau -1.0 sesuai arah tekuk siku ID 1
      elbow_up: true                  # true = solusi siku di atas, false = siku di bawah
      clamp_to_workspace: true        # Clamp ke batas jangkauan jika sedikit di luar L1+L2
      max_reach_margin_m: 0.08        # Toleransi jarak di luar L1+L2 yang masih boleh di-clamp (8 cm)
      pregrasp_dx_m: -0.04            # Offset X titik pre-grasp (-4 cm)
      pregrasp_dz_m: 0.02             # Offset Z titik pre-grasp (+2 cm)
      carry_j1_deg: 0.0               # Sudut J1 posisi angkat/bawa setelah grasp
      carry_j2_deg: 0.0               # Sudut J2 posisi angkat/bawa setelah grasp
      target_timeout_sec: 5.0         # Batas umur koordinat /arm/target_point sebelum fallback ke .motion
      fallback_motion: "ambil_tas_simple"
