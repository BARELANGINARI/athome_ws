arm_motion_server:
  ros__parameters:
    # -------------------------------------------------------------------------
    # 1. Koneksi Serial Dynamixel & Lokasi File Motion (Aktif dibaca node)
    # -------------------------------------------------------------------------
    port: "/dev/ttyUSB0"              # Port serial USB-to-Dynamixel (U2D2 / USB2Dynamixel)
    baudrate: 1000000                 # Kecepatan komunikasi serial Dynamixel AX-18A (1 Mbps)
    motions_dir: ""                   # Folder file .motion kustom (kosong = otomatis pakai folder motions/ package)

    # -------------------------------------------------------------------------
    # 2. Parameter Gerak Lengan Umum (Catatan: saat ini node memakai #define di arm_motion_server.cpp)
    # -------------------------------------------------------------------------
    update_rate_hz: 50                # Frekuensi pengiriman posisi ke servo per detik (50 Hz = tiap 20 ms)
    max_speed_dps: 60.0               # Kecepatan gerak maksimum sendi lengan (derajat per detik)
    work_range_deg: 260.0             # Batas sudut gerak kerja maksimum (+/- derajat dari titik nol)

    # -------------------------------------------------------------------------
    # 3. Parameter Adaptive Gripper (Catatan: saat ini nilai aktif mengikuti #define di C++)
    # -------------------------------------------------------------------------
    gripper:
      id: 6                           # ID servo Dynamixel untuk gripper
      max_open_deg: 110.0             # Sudut buka maksimal rahang gripper (derajat dari posisi menutup rapat)
      default_release_deg: 110.0      # Sudut bukaan default saat service /arm/release_gripper dipanggil
      closing_speed: 60               # Kecepatan menutup rahang saat mencari objek (skala 1-1023, pelan agar aman)
      load_threshold: 170             # Ambang beban/torsi motor (0-1023) untuk mendeteksi gripper sudah menyentuh benda
      step_ticks: 4                   # Besar langkah penutupan tiap iterasi dalam satuan tick (~1.17 derajat/step)
      step_ms: 40                     # Jeda antar langkah penutupan dalam milidetik (40 ms = 25 Hz)
      stall_ticks: 15                 # Selisih posisi (present - goal) untuk mendeteksi rahang tertahan benda secara fisik
      squeeze_ticks: 20               # Tambahan penekanan (+tick ke arah tutup) setelah objek terdeteksi agar genggaman kuat
      confirm_count: 3                # Jumlah deteksi kontak berturut-turut sebelum genggaman dinyatakan valid
      compliance_slope: 50            # Kelenturan kontrol PID servo saat menggenggam (makin besar = makin lembut)

    # Arsip kalibrasi lama (sebelum gripper diperlebar):
    # calibration:
    #   servo_1: { center_tick: 802, cw_limit: 10, ccw_limit: 1010 }
    #   servo_4: { center_tick: 809, cw_limit: 10, ccw_limit: 1010 }
    #   servo_5: { center_tick: 221, cw_limit: 10, ccw_limit: 1010 }
    #   servo_6: { center_tick: 506, cw_limit: 491, ccw_limit: 779 }

    # -------------------------------------------------------------------------
    # 4. Catatan Kalibrasi Titik Nol & Batas Aman Servo (Nilai aktif dikompilasi di calibration_data.h)
    # -------------------------------------------------------------------------
    calibration:
      servo_1: { center_tick: 521, cw_limit: 10, ccw_limit: 1010 }   # Joint 2 (siku): titik nol & batas putar CW/CCW (tick 0-1023)
      servo_4: { center_tick: 185, cw_limit: 10, ccw_limit: 1010 }   # Joint 1 kiri (bahu): berpasangan simetris dengan servo 5
      servo_5: { center_tick: 834, cw_limit: 10, ccw_limit: 1010 }   # Joint 1 kanan (bahu): berlawanan arah dengan servo 4
      servo_6: { center_tick: 348, cw_limit: 333, ccw_limit: 730 }   # Gripper: center_tick=tutup rapat, cw_limit=batas tutup, ccw_limit=batas buka penuh

    # -------------------------------------------------------------------------
    # 5. Parameter Inverse Kinematics / IK Planar 2-Link (Aktif dibaca node untuk gerak dinamis)
    # -------------------------------------------------------------------------
    ik:
      enabled: true                   # true = /arm/ambil_tas_simple hitung sudut IK dari /arm/target_point; false = pakai file .motion
      l1_m: 0.21                      # Panjang lengan atas dari poros bahu (ID 4/5) ke poros siku (ID 1), dalam meter (21 cm)
      l2_m: 0.075                     # Panjang lengan bawah dari poros siku (ID 1) ke tengah gripper (ID 6), dalam meter (7.5 cm)
      shoulder_x_m: 0.13              # Posisi poros bahu ke arah depan pada koordinat X vision (meter)
      shoulder_z_m: 0.61              # Tinggi poros bahu pada koordinat Z vision (0.44 m kamera + 0.17 m = 0.61 m)
      j1_zero_offset_deg: 90.0        # Sudut fisik link 1 terhadap sumbu horizontal +X saat servo J1 di posisi 0.0 derajat
      j2_zero_offset_deg: 0.0         # Sudut fisik link 2 relatif terhadap link 1 saat servo J2 di posisi 0.0 derajat
      j1_sign: -1.0                   # Pengali arah putar J1 (+1.0 atau -1.0; -1.0 karena arah menjulur ke depan bernilai negatif)
      j2_sign: 1.0                    # Pengali arah putar J2 (+1.0 atau -1.0) sesuai arah tekuk fisik servo ID 1
      elbow_up: true                  # Pilihan bentuk tekukan siku: true = siku menekuk ke atas, false = siku menekuk ke bawah
      clamp_to_workspace: true        # true = jika target sedikit lebih jauh dari L1+L2 (28.5 cm), lengan tetap menjulur maksimal ke arah objek
      max_reach_margin_m: 0.08        # Toleransi jarak ekstra di luar L1+L2 yang masih boleh di-clamp (meter); lewat dari ini ditolak & fallback
      pregrasp_dx_m: -0.04            # Jarak mundur titik persiapan (pre-grasp) sebelum maju menyentuh objek (meter, -4 cm)
      pregrasp_dz_m: 0.02             # Ketinggian tambahan titik persiapan (pre-grasp) di atas titik tangkap (meter, +2 cm)
      carry_j1_deg: 0.0               # Sudut target Joint 1 untuk posisi membawa objek setelah berhasil menggenggam
      carry_j2_deg: 0.0               # Sudut target Joint 2 untuk posisi membawa objek setelah berhasil menggenggam
      target_timeout_sec: 5.0         # Masa berlaku koordinat /arm/target_point (detik); jika lebih lama, otomatis pakai fallback_motion
      fallback_motion: "ambil_tas_simple"  # Nama file .motion cadangan jika tidak ada target 3D segar atau objek di luar jangkauan IK
