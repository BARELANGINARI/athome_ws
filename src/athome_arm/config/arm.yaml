arm_motion_server:
  ros__parameters:
    port: "/dev/ttyUSB0"
    baudrate: 1000000
    motions_dir: ""  

    update_rate_hz: 50
    max_speed_dps: 60.0
    work_range_deg: 260.0

    gripper:
      id: 6
      max_open_deg: 80.0
      default_release_deg: 65.0
      closing_speed: 60
      load_threshold: 170
      step_ticks: 4
      step_ms: 40
      stall_ticks: 15
      squeeze_ticks: 20
      confirm_count: 3
      compliance_slope: 50

    calibration:
      servo_1: { center_tick: 802, cw_limit: 10, ccw_limit: 1010 }
      servo_4: { center_tick: 809, cw_limit: 10, ccw_limit: 1010 }
      servo_5: { center_tick: 221, cw_limit: 10, ccw_limit: 1010 }
      servo_6: { center_tick: 506, cw_limit: 491, ccw_limit: 779 }

