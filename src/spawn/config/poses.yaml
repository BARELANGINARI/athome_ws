# Preset koordinat spawn robot di peta (dipakai launch spawn.py + test_poses.py).
# Kunci = nama preset (string), nilai = pose di frame `map`.
#   x, y    : meter, sesuai koordinat peta navigation (src/navigation/maps/map.yaml)
#   yaw_deg : 0 = menghadap +X peta (putar CCW positif, -180..180)
# Tambah preset baru = tambah blok di bawah, tanpa ubah code.
#
# Validasi (tabel status semua preset + cek bebas/dinding di peta):
#   ros2 launch spawn test_poses.py
# Pakai salah satu preset:
#   ros2 launch spawn spawn.py preset:=tengah
presets:
  # --- preset bernama (pakai ini) ---
  "start":        {x: 0.0,  y: 0.0,   yaw_deg: 0.0}    # titik awal mapping, area lega
  "tengah":       {x: 2.0,  y: 0.0,   yaw_deg: 0.0}    # lorong tengah (arah barat-timur)
  "utara":        {x: 1.0,  y: 2.0,   yaw_deg: 90.0}   # ruangan utara, hadap +Y
  "barat":        {x: -1.6, y: 0.0,   yaw_deg: 180.0}  # sisi barat, hadap -X
  "lorong_timur": {x: 4.6,  y: 1.5,   yaw_deg: 90.0}   # ujung timur, koridor vertikal
  "selatan":      {x: 1.0,  y: -2.0,  yaw_deg: 0.0}    # ruangan selatan
  # --- alias lama (dipertahankan agar perintah lama tetap jalan) ---
  "1":            {x: 1.0,  y: 1.5,   yaw_deg: 0.0}
  "2":            {x: 0.0,  y: 0.0,   yaw_deg: 0.0}
