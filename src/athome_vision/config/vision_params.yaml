vision:
  ros__parameters:
    task: "all"
    camera_fps: 30.0
    camera_resolution: "vga"
    depth_mode: "performance"
    publish_yaw: true
    yaw_360: true
    depth_minimum_distance: 30.0
    enable_body_tracking: true
    enable_yolo: true
    debug_window: false
    mirror: true
    yolo_model: "models/help_me_carry/paper_bag.onnx"
    yolo_classes: "models/help_me_carry/paper_bag_classes.txt"
    yolo_conf: 0.35
    bag_conf: 0.35
    yolo_nms: 0.45
    yolo_size: 640
    yolo_stride: 3
    yolo_min_area: 250.0
    bag_labels: ["bag", "paper_bag", "backpack", "handbag", "suitcase"]
    face_detect_model: "models/receptionist/face_detection_yunet.onnx"
    face_detect_conf: 0.30
    gender_model: "models/receptionist/genderage.onnx"
    color_model: "models/receptionist/color_model.onnx"
    color_labels: "models/receptionist/color_names.txt"
    hair_model: "models/receptionist/hair_model.onnx"
    hair_labels: "models/receptionist/hair_names.txt"
    hat_model: "models/receptionist/hat.onnx"
    glasses_model: "models/receptionist/glasses.onnx"
    accessory_conf: 0.45
    face_model: "models/receptionist/arcface_w600k_r50.onnx"
    face_threshold: 0.40
    botol_model: "models/receptionist/water.onnx"
    soda_model: "models/receptionist/soda.onnx"
    cracker_model: "models/restaurant/crackerbox.onnx"
    pringles_model: "models/restaurant/pringles.onnx"
    sugarbox_model: "models/restaurant/sugarbox.onnx"
    milk_model: "models/receptionist/milk.onnx"
    drink_min_area: 180.0
    drink_conf: 0.48
    water_conf: 0.25
    enable_drinks: true
    chair_model: ""
    enable_chair: true
    enable_bag: true
    host_name: "Revaldo"
    host_photo: "models/receptionist/host.jpg"
    host_shirt_color: "black"
    host_gender: "male"
    host_hair_color: "black"
    enable_back_detection: true
    person_back_topic: "/vision/person_back"

    # Distance limits (meters) - Objects beyond these ranges will not be detected/bboxed
    person_max_dist: 2.5
    person_seated_max_dist: 3.0
    chair_max_dist: 2.0
    bag_max_dist: 2.0
    drink_max_dist: 2.5
